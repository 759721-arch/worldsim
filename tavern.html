function redrawTalents() {
  var data = window._cardPickData;
  if (!data) return;
  var w = state.worlds.find(function(w){return w.id===data.worldId;});
  if (!w) return;
  var rerolls = w.protagonist._rerolls || 0;
  if (rerolls < 1) { toast('没有重骰次数了（需在命运之书解锁「重骰机会」）', 'error'); return; }
  w.protagonist._rerolls--;
  closeCardPicker();
  saveState();
  wizDrawTalents();
}

function closeCardPicker() {
  var el = document.getElementById('cardPickerOverlay');
  if (el) el.remove();
  window._cardPickData = null;
}

function pickTalentCard(talentId) {
  var data = window._cardPickData;
  if (!data) return;
  var w = state.worlds.find(function(w){return w.id===data.worldId;});
  if (!w) return;
  var talent = data.picks.find(function(t){return t.id===talentId;});
  if (!talent) return;

  // Handle slot limit — show replacement UI inside the card picker
  if (effectiveTalents(w.protagonist) >= w.protagonist.maxSlots) {
    showReplaceUI(w, talent, data);
    return;
  }

  closeCardPicker();
  w.protagonist.drawCount--;
  w.protagonist.talents.push(talent);
  applyTalentEffects(w, talent, false);
  // Track sealed talent globally
  if (!state.sealedTalents) state.sealedTalents = [];
  if (state.sealedTalents.indexOf(talentId) < 0) state.sealedTalents.push(talentId);
  // Track talent stat for achievements
  ensureWorldStats(w);
  w.stats.talentsDrawn = (w.stats.talentsDrawn||0) + 1;
  saveState(); renderWizard(w);
  toast('获得' + talent.rarity + '级天赋：' + talent.name, 'success');
  checkAchievements(w);
}

function showReplaceUI(w, newTalent, cardData) {
  var rarityColors = { '白':'#aaa','绿':'#4a8','蓝':'#48a','紫':'#a4a','金':'#da4','红':'#e44' };

  var html = '<div style="margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08)">';
  html += '<div style="text-align:center;font-size:13px;color:var(--text-dim);margin-bottom:8px">天赋槽已满(' + w.protagonist.maxSlots + ')，选择要替换的旧天赋：</div>';
  html += '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">';
  w.protagonist.talents.forEach(function(t, i){
    var rc = rarityColors[t.rarity]||'#aaa';
    html += '<div style="padding:8px 14px;background:'+rc+'15;border:1px solid '+rc+'40;border-radius:10px;cursor:pointer;font-size:12px;color:var(--text);text-align:center" onclick="confirmReplace('+i+',\''+newTalent.id+'\')">'
      + '<div style="font-weight:600;color:'+rc+'">'+t.name+'</div>'

  });

  html += '<div style="text-align:center;margin-top:10px;font-size:11px;color:var(--text-dim)">替换后将失去旧天赋，新天赋「<span style="color:'+ra+'">'+newTalent.name+'</span>」装备</div>';

function confirmReplace(oldIdx, newTalentId) {
  var data = window._cardPickData;
  if (!data) return;
  var w = state.worlds.find(function(w){return w.id===data.worldId;});
  if (!w) return;
  var newTalent = data.picks.find(function(t){return t.id===newTalentId;});
  if (!newTalent) return;
  var oldTalent = w.protagonist.talents[oldIdx];
  applyTalentEffects(w, oldTalent, true);
  w.protagonist.talents.splice(oldIdx, 1);
  w.protagonist.drawCount--;
  w.protagonist.talents.push(newTalent);
  // Track sealed talent globally
  if (!state.sealedTalents) state.sealedTalents = [];
  if (state.sealedTalents.indexOf(newTalentId) < 0) state.sealedTalents.push(newTalentId);
  applyTalentEffects(w, newTalent, false);
  closeCardPicker();
  saveState(); renderWizard(w);
  toast(newTalent.rarity+'级天赋「'+newTalent.name+'」替换了「'+oldTalent.name+'」', 'success');
}
function wizRemoveTalent(id) {
  var w = getActiveWorld(); if (!w) return;
  var idx = w.protagonist.talents.findIndex(function(t){return t.id===id;});
  if (idx<0) return;
  applyTalentEffects(w, w.protagonist.talents[idx], true);
  w.protagonist.talents.splice(idx, 1);
  saveState(); renderWizard(w);
}
function applyTalentEffects(w, talent, reverse) {
  var sign = reverse ? -1 : 1;
  var e = talent.effects || {};
  if (e.slots) w.protagonist.maxSlots += e.slots*sign;
  if (e.points) w.protagonist.drawCount += e.points*sign;
}

function finishCreation() {
  var w = getActiveWorld();
  if (!w) return;
  w._started = true;
  saveState();
  // Restore full game UI
  document.getElementById('sidebar').style.display = '';
  document.getElementById('sidebarToggle').style.display = '';
  // Collapse sidebar by default during gameplay
  document.getElementById('sidebar').classList.remove('open');
  showPanel('chat');
  renderAll();
  updateSpeakerTag();

  // Generate opening only for newly created worlds (no chat history yet)
  var hid = w.id;
  var isNew = !state.chatHistory[hid] || state.chatHistory[hid].length === 0;
  if (w && state.apiKey && (w.mode === 'story' || w.mode === 'dice') && isNew) {
    toast('世界创建完成！开始冒险吧', 'success');
    generatePlotOutline(w);
  } else if (w && state.apiKey && isNew) {
    toast('世界创建完成！开始冒险吧', 'success');
    generateAdventureIntro(w);
  } else {
    toast('世界已更新', 'success');
  }
}

function startNewGame() {
  var w = blankWorld();
  state.worlds.push(w);
  state.activeWorldId = w.id;
  state.activeSpeaker = null;
  state.chatHistory[w.id] = [];
  saveState();
  enterGame();
  // Clean creation-only mode: hide sidebar, just show wizard
  document.getElementById('sidebar').style.display = 'none';
  document.getElementById('panel-chat').classList.remove('active');
  document.getElementById('panel-settings').classList.remove('active');
  document.getElementById('panel-wizard').classList.add('active');
  // Override sidebar toggle visibility for mobile
  document.getElementById('sidebarToggle').style.display = 'none';
  state._panelFromTitle = true; // came from title screen, goBackToTitle returns to title
  wizardStepState[w.id] = 0;
  renderWizard(w);
  toast('开始创建你的世界', 'info');
}

function continueGame() {
  if (!state.activeWorldId || !state.worlds.find(function(w){return w.id===state.activeWorldId})) {
    if (state.worlds.length > 0) {
      state.activeWorldId = state.worlds[0].id;
      saveState();
    } else {
      toast('暂无存档，请先开始游戏', 'info');
      startNewGame();
      return;
    }
  }
  enterGame();
  showPanel('chat');
  renderAll();
  updateSpeakerTag();
  toast('欢迎回来', 'info');
}

function loadManualSaveFromModal(worldId, idx) {
  var w = state.worlds.find(function(x){ return x.id === worldId; });
  if (!w) return;
  hideSaveModal();
  doLoadManualSave(w, idx);
}

function deleteManualSaveFromModal(worldId, idx) {
  var w = state.worlds.find(function(x){ return x.id === worldId; });
  if (!w) return;
  var save = (w.saves && w.saves.manualList) ? w.saves.manualList[idx] : null;
  if (!save) return;
  if (!confirm('确定要删除 ' + save.label + ' 吗？')) return;
  w.saves.manualList.splice(idx, 1);
  saveState();
  hideSaveModal();
  showSaves();
  toast(save.label + ' 已删除', 'info');
}

function generatePlotOutline(w) {
  // First: generate plot outline
  addChatSystem(w, '◉ 正在生成剧情大纲…');
  var styleStr = w.styleTags.join('、') || '自然流畅';
  var nodeGuide = {short:'5-7个',medium:'8-12个',long:'12-20个'};
  var prompt = '为一个' + w.name + '的' + ({short:'短篇',medium:'中篇',long:'长篇'})[w.length] + '故事生成剧情大纲。'
    + '该篇幅应生成约' + nodeGuide[w.length] + '关键节点。背景：' + (w.background || '') + '。文风：' + styleStr + '。\n\n'
    + '请按以下JSON格式输出：\n{"opening":"故事开篇场景和氛围描述（100字内）","nodes":[{"name":"节点名","desc":"关键事件描述"}],"heroes":["我方重要人物（不含主角姓名）"],"villains":["反派或敌对势力"],"themes":["核心主题"],"mysteries":["未解之谜"]}\n只输出JSON。';

  callAI(prompt, function(text){
    try {
      var t = sanitizeJson(text);
      var outline = JSON.parse(t);
      if (outline.nodes) w.plotNodes = outline.nodes;
      if (outline.themes) w.plotThemes = outline.themes;
      if (outline.mysteries) w.plotMysteries = outline.mysteries;
      if (outline.heroes) w.plotHeroes = outline.heroes;
      if (outline.villains) w.plotVillains = outline.villains;
      addChatSystem(w, '✓ 剧情大纲已生成（' + (outline.nodes ? outline.nodes.length : 0) + '个节点）——已加密保存');
      // Show summary in chat
      var summary = '≡ **故事蓝图**\n';
      if (outline.themes) summary += '主题：' + outline.themes.join('、') + '\n';
      if (outline.villains) summary += '对手：' + outline.villains.join('、') + '\n';
      addChatSystem(w, summary);
    } catch(e) {
      addChatSystem(w, '‡ 大纲解析出错，但游戏不受影响');
    }
    // Then: generate opening
    generateAdventureIntro(w);
  });
}

// ===== FEATURE: 存档档位系统 =====

function manualSave() {
  var w = getActiveWorld();
  if (!w) { toast('请先选择一个世界', 'error'); return; }
  showSaveSlotModal(w);
}

function showSaveSlotModal(w) {
  if (!w.saves.manualList) w.saves.manualList = [];
  var list = w.saves.manualList;

  var html = '<div class="modal-overlay" onclick="hideSaveSlotModal()">'
    + '<div class="modal-card" onclick="event.stopPropagation()" style="max-width:440px">'
    + '<h3 style="margin-bottom:4px;font-size:18px">◉ 存档管理</h3>'
    + '<div style="font-size:12px;color:var(--text-dim);margin-bottom:14px">' + esc(w.name) + ' — 点击空槽位存档，点击已用槽位覆盖</div>';

  for (var i = 0; i < 3; i++) {
    var save = list[i];
    var isOccupied = !!save;
    html += '<div class="save-slot' + (isOccupied ? ' occupied' : '') + '" '
      + 'onclick="' + (isOccupied ? ('saveToSlot(' + i + ', true)') : ('saveToSlot(' + i + ', false)')) + '">'
      + '<span class="save-slot-num">档位 ' + (i + 1) + '</span>';

    if (isOccupied) {
      html += '<span class="save-slot-name" id="saveName_' + i + '">' + esc(save.label) + '</span>'
        + '<span class="save-slot-info">' + new Date(save.time).toLocaleString("zh-CN") + ' · ' + save.msgCount + '轮</span>';
    } else {
      html += '<span class="save-slot-name" style="color:var(--text-dim)">— 空 —</span>'
        + '<span class="save-slot-info">点击此处存档</span>';
    }

    html += '<div class="save-slot-actions">';
    if (isOccupied) {
      html += '<span class="save-slot-action" onclick="event.stopPropagation();startRenameSave(' + i + ')" title="重命名">✎</span>';
      html += '<span class="save-slot-action" onclick="event.stopPropagation();deleteSaveSlot(' + i + ')" title="删除" style="color:var(--red)">✕</span>';
    }
    html += '</div></div>';
  }

  html += '<button class="btn btn-ghost" onclick="hideSaveSlotModal()" style="margin-top:12px;width:100%">关闭</button>';
  html += '</div></div>';

  var existing = document.getElementById('saveSlotModal');
  if (existing) existing.remove();
  var div = document.createElement('div');
  div.id = 'saveSlotModal';
  div.innerHTML = html;
  document.body.appendChild(div);
  window._saveSlotWorldId = w.id;
}

function hideSaveSlotModal() {
  var el = document.getElementById('saveSlotModal');
  if (el) el.remove();
}

function saveToSlot(idx, confirmOverwrite) {
  var w = state.worlds.find(function(x){ return x.id === window._saveSlotWorldId; });
  if (!w) return;
  if (!w.saves.manualList) w.saves.manualList = [];
  var existing = w.saves.manualList[idx];

  if (existing && confirmOverwrite) {
    if (!window.confirm('确定要用新存档覆盖「' + existing.label + '」吗？')) return;
  }

  var hid = w.id;
  var log = state.chatHistory[hid] || [];

  var newSave = {
    id: Date.now(),
    label: existing ? existing.label : ('存档' + (idx + 1)),
    time: Date.now(),
    msgCount: log.length,
    snapshot: {
      chatHistory: JSON.parse(JSON.stringify(log)),
      protagonist: JSON.parse(JSON.stringify(w.protagonist)),
      characters: JSON.parse(JSON.stringify(w.characters)),
      worldSummary: w.worldSummary || '',
      background: w.background || '',
      era: w.era || '',
    }
  };

  w.saves.manualList[idx] = newSave;
  saveState();
  saveCheckpoint(w, log.length, newSave.label);
  hideSaveSlotModal();
  toast('◉ 已保存到档位 ' + (idx + 1) + ' — ' + newSave.label, 'success');
}

function startRenameSave(idx) {
  var el = document.getElementById('saveName_' + idx);
  if (!el) return;
  var currentName = el.textContent;
  var input = document.createElement('input');
  input.type = 'text';
  input.value = currentName;
  input.style.cssText = 'width:100%;font-size:13px;padding:2px 4px;border:1px solid var(--accent);border-radius:4px;background:var(--bg);color:var(--text);';
  input.onblur = function() { finishRenameSave(idx, input.value); };
  input.onkeydown = function(e) { if (e.key === 'Enter') { finishRenameSave(idx, input.value); } if (e.key === 'Escape') { el.textContent = currentName; } };
  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();
}

function finishRenameSave(idx, newName) {
  var w = state.worlds.find(function(x){ return x.id === window._saveSlotWorldId; });
  if (!w || !w.saves.manualList || !w.saves.manualList[idx]) return;
  var name = (newName || '').trim();
  if (!name) return;
  w.saves.manualList[idx].label = name;
  saveState();
  var el = document.getElementById('saveName_' + idx);
  if (el) el.textContent = name;
}

function deleteSaveSlot(idx) {
  var w = state.worlds.find(function(x){ return x.id === window._saveSlotWorldId; });
  if (!w || !w.saves.manualList || !w.saves.manualList[idx]) return;
  if (!window.confirm('确定要删除「' + w.saves.manualList[idx].label + '」吗？')) return;
  w.saves.manualList.splice(idx, 1);
  saveState();
  showSaveSlotModal(w);
  toast('档位 ' + (idx + 1) + ' 已清空', 'info');
}

function showLoadSaveModal(w) {
  var html = '<div class="modal-overlay" onclick="hideLoadSaveModal()">'
    + '<div class="modal-card" onclick="event.stopPropagation()" style="max-width:480px">'
    + '<h3 style="margin-bottom:16px;font-size:18px">◉ 选择要加载的存档</h3>';
  
  w.saves.manualList.forEach(function(save, idx) {
    html += '<div style="padding:12px;margin-bottom:8px;background:var(--bg2);border-radius:8px;cursor:pointer" '
      + 'onclick="doLoadManualSave(getActiveWorld(), ' + idx + ')">'
      + '<div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px">' + esc(save.label) + '</div>'
      + '<div style="font-size:12px;color:var(--text-dim)">存档于：' + new Date(save.time).toLocaleString("zh-CN") + '</div>'
      + '<div style="font-size:12px;color:var(--text-dim)">对话轮次：' + save.msgCount + '</div>'
      + '</div>';
  });
  
  html += '<button class="btn btn-ghost" onclick="hideLoadSaveModal()" style="margin-top:12px">取消</button>';
  html += '</div></div>';
  
  var existing = document.getElementById('loadSaveModal');
  if (existing) existing.remove();
  
  var div = document.createElement('div');
  div.id = 'loadSaveModal';
  div.innerHTML = html;
  document.body.appendChild(div);
}

function hideLoadSaveModal() {
  var el = document.getElementById('loadSaveModal');
  if (el) el.remove();
}

function doLoadManualSave(w, idx) {
  var save = w.saves.manualList[idx];
  if (!save) return;
  
  if (save.snapshot) {
    state.chatHistory[w.id] = JSON.parse(JSON.stringify(save.snapshot.chatHistory));
    w.protagonist = JSON.parse(JSON.stringify(save.snapshot.protagonist));
    w.characters = JSON.parse(JSON.stringify(save.snapshot.characters));
    w.worldSummary = save.snapshot.worldSummary || '';
    w.background = save.snapshot.background || '';
    w.era = save.snapshot.era || '';
  }
  
  saveState();
  hideLoadSaveModal();
  enterGame();
  showPanel('chat');
  renderAll();
  updateSpeakerTag();
  addChatSystem(w, '‣ 已回档到：' + save.label);
  toast('已从 ' + save.label + ' 恢复', 'success');
}


function autoSave() {
  var w = getActiveWorld();
  if (!w) return;
  var hid = w.id;
  var log = state.chatHistory[hid] || [];
  w.saves.auto = {
    time: Date.now(),
    label: '自动存档',
    msgCount: log.length,
    snapshot: {
      chatHistory: JSON.parse(JSON.stringify(log)),
      protagonist: JSON.parse(JSON.stringify(w.protagonist)),
      characters: JSON.parse(JSON.stringify(w.characters)),
      worldSummary: w.worldSummary || '',
      background: w.background || '',
      era: w.era || '',
    }
  };
  saveState();
  flashIndicator('autoSaveIndicator');
}

function loadSave(slot) {
  var w = getActiveWorld();
  if (!w) { toast('请先选择一个世界', 'error'); return; }
  var save = w.saves[slot];
  if (!save) { toast('该存档槽为空', 'error'); return; }
  var snap = save.snapshot;
  state.chatHistory[w.id] = snap.chatHistory || [];
  w.protagonist = snap.protagonist || w.protagonist;
  w.characters = snap.characters || w.characters;
  w.worldSummary = snap.worldSummary || '';
  if (snap.background) w.background = snap.background;
  if (snap.era) w.era = snap.era;
  saveState();
  renderAll();
  renderSidePanel();
  toast('◫ 已读取「' + esc(save.label) + '」', 'success');
}

function flashIndicator(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.add('show');
  setTimeout(function () {
    if (el) el.classList.remove('show');
  }, 2000);
}

// ===== FEATURE: 自动剧情总结 =====
function triggerSummary() {
  var w = getActiveWorld();
  if (!w) { toast('请先选择一个世界', 'error'); return; }
  if (!state.apiKey) { toast('请先配置API Key', 'error'); showPanel('settings'); return; }
  toast('• 正在生成剧情总结…', 'info');
  generateSummary(w);
}
function generateSummary(w) {
  if (!state.apiKey) return; // skip in local mode
  var hid = w.id;
  var log = state.chatHistory[hid] || [];
  var oldSummary = w.worldSummary || '';

  // Show indicator
  var si = document.getElementById('summaryIndicator');
  if (si) { si.textContent = '• 总结中...'; si.classList.add('show'); }

  // Build context
  var recentMsgs = log.slice(-20).map(function (m) {
    if (m.type === 'narrate') return '[叙述] ' + m.text.slice(0, 200);
    if (m.type === 'system') return '';
    return '[' + m.speaker + ']: ' + m.text.slice(0, 200);
  }).filter(Boolean).join('\n');

  var charsInfo = w.characters.map(function (c) {
    return c.name + '(' + (c.tag || '') + '): ' + (c.desc || '').slice(0, 100);
  }).join('; ');

  var prompt = '请根据对话记录，总结当前世界的故事进展。\n\n';
  if (oldSummary) prompt += '【历史总结】\n' + oldSummary + '\n\n';
  prompt += '【角色列表】\n' + charsInfo + '\n\n';
  prompt += '【世界背景】\n' + (w.background || '未知').slice(0, 500) + '\n\n';
  prompt += '【最近对话记录】\n' + recentMsgs + '\n\n';
  prompt += '请用中文输出以下内容（每条简洁扼要）：\n';
  prompt += '1. 事件时间线：从开始到现在的所有重要事件，按时间顺序列出\n';
  prompt += '2. 主要角色及其当前状态：每个角色的当前处境、态度、目标\n';
  prompt += '3. 角色间关系发展：重要的人际关系变化\n';
  prompt += '注意：不要提及玩家尚未接触的设定和剧情。只基于已发生的对话进行总结。';

  fetch(state.apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.apiKey },
    body: JSON.stringify({
      model: state.apiModel,
      messages: [
        { role: 'system', content: '你是一个故事记录助手。用中文回复，简洁扼要地总结故事进展。' },
        { role: 'user', content: prompt }
      ],
      temperature: 0.3,
      max_tokens: 600,
    }),
  })
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function (d) {
    var text = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '';
    w.worldSummary = text.trim();
    saveState();
    if (si) { si.textContent = '✓ 总结完成'; }
    setTimeout(function () { if (si) si.classList.remove('show'); }, 2000);
  })
  .catch(function () {
    if (si) { si.textContent = '‡ 总结失败'; }
    setTimeout(function () { if (si) si.classList.remove('show'); }, 2000);
  });
}

// ===== FEATURE: 角色状态栏 =====
function toggleCharStatus(el) {
  el.classList.toggle('open');
}
function renderCharacterStatus() {
  var el = document.getElementById('charStatusList');
  var section = document.getElementById('charStatusSection');
  if (!el || !section) return;
  var w = getActiveWorld();
  if (!w || !w.characters || w.characters.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';

  var html = '';
  w.characters.forEach(function (c, idx) {
    html += '<div class="char-status-item" onclick="toggleCharStatus(this)">'
      + '<div class="char-status-header">'
      + '<span>' + esc(c.name) + '</span>'
      + (c.job ? '<span class="char-tag">' + esc(c.job) + '</span>' : '')
      + '</div>'
      + '<div class="char-status-body">'
      + (c.weapon ? '<div class="char-status-mini">‡ ' + esc(c.weapon) + '</div>' : '')
      + (c.abilities ? '<div class="char-status-mini">◉ ' + esc(c.abilities) + '</div>' : '')
      + (c.appearanceDetail ? '<div class="char-status-mini">◉ ' + esc(c.appearanceDetail) + '</div>' : '')
      + (c.desc ? '<div class="char-status-mini" style="font-size:10px;opacity:0.6;margin-top:4px">' + esc(c.desc.slice(0,80)) + (c.desc.length>80?'...':'') + '</div>' : '')
      + '</div></div>';
  });

  el.innerHTML = html;
}

// ===== FEATURE: 存档管理UI =====
function renderSaveManagement() {
  var w = getActiveWorld();
  if (!w) return '<div style="text-align:center;color:var(--text-dim);padding:12px;font-size:12px">请先选择一个世界</div>';

  var slots = [
    { key: 'manual', label: '◉ 手动存档', icon: '◉' },
    { key: 'auto', label: '‣ 自动存档', icon: '‣' }
  ];

  var html = '';
  slots.forEach(function (s) {
    var saveData = w.saves && w.saves[s.key];
    if (saveData) {
      var timeStr = new Date(saveData.time).toLocaleString();
      var msgInfo = '消息数: ' + (saveData.msgCount || 0);
      html += '<div class="save-slot">'
        + '<div class="save-slot-header">'
        + '<span class="save-slot-type">' + s.icon + ' ' + saveData.label + '</span>'
        + '<span class="save-slot-time">' + timeStr + '</span>'
        + '</div>'
        + '<div class="save-slot-info">' + msgInfo + '</div>'
        + '<div class="save-slot-actions">'
        + '<button class="btn btn-sm" onclick="loadSave(\'' + s.key + '\')">◫ 读取</button>'
        + '</div></div>';
    } else {
      html += '<div class="save-slot empty">'
        + '<div class="save-slot-header">'
        + '<span class="save-slot-type">' + s.icon + ' ' + s.label + '</span>'
        + '</div>'
        + '<div class="save-slot-info">未存档</div>'
        + '</div>';
    }
  });
  return html;
}
function init() {
  loadState();
  // Ensure activeWorldId is valid
  if (state.activeWorldId && !state.worlds.find(function (w) { return w.id === state.activeWorldId; })) {
    state.activeWorldId = state.worlds.length > 0 ? state.worlds[0].id : null;
  }
  showTitleScreen();
}

// Start the application
init();

(function initAtmosphere() {
  var container = document.getElementById('embers');
  if (!container) return;
  var count = 25;
  for (var i = 0; i < count; i++) {
    var ember = document.createElement('div');
    ember.className = 'ember';
    ember.style.left = Math.random() * 100 + '%';
    ember.style.bottom = Math.random() * 100 + '%';
    ember.style.animationDuration = (5 + Math.random() * 15) + 's';
    ember.style.animationDelay = Math.random() * 10 + 's';
    ember.style.width = (1.5 + Math.random() * 3) + 'px';
    ember.style.height = ember.style.width;
    container.appendChild(ember);
  }
})();

// Scene transition effect (used by chapter switching if needed)
window.sceneTransitionIn = function(callback) {
  var overlay = document.getElementById('sceneTransition');
  if (!overlay) { if (callback) callback(); return; }
  overlay.classList.add('active');
  setTimeout(function() {
    overlay.classList.remove('active');
    if (callback) callback();
  }, 800);
};

// ============================================================
// TITLE SCREEN: Canvas procedural background + ember particles
// ============================================================
(function initTitleScreen() {

  // ---- Canvas Background ----
  var canvas = document.getElementById('titleCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Nebula nodes — slow drifting blobs
  var nodes = [];
  for (var i = 0; i < 6; i++) {
    nodes.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.12,
      r: 220 + Math.random() * 280,
      hue: Math.random() < 0.7 ? 30 : 260,   // amber or deep violet
      alpha: 0.03 + Math.random() * 0.035,
      phase: Math.random() * Math.PI * 2,
      phaseSpeed: 0.003 + Math.random() * 0.004
    });
  }

  // Star field
  var stars = [];
  for (var s = 0; s < 160; s++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: 0.3 + Math.random() * 1.1,
      alpha: 0.1 + Math.random() * 0.5,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.008 + Math.random() * 0.015
    });
  }

  // Filament lines — ghostly structural lines like star trails
  var filaments = [];
  for (var f = 0; f < 5; f++) {
    filaments.push({
      x1: Math.random(),  y1: Math.random(),
      x2: Math.random(),  y2: Math.random(),
      alpha: 0.015 + Math.random() * 0.02,
      width: 0.3 + Math.random() * 0.6
    });
  }

  var frame = 0;
  function draw() {
    var W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Deep void base
    ctx.fillStyle = '#06050a';
    ctx.fillRect(0, 0, W, H);

    // Nebula blobs
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      n.phase += n.phaseSpeed;
      var pulse = Math.sin(n.phase) * 0.012;
      var grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * (1 + pulse));
      var c = n.hue === 30
        ? 'rgba(196,149,106,' + (n.alpha * (1 + pulse * 2)) + ')'
        : 'rgba(80,65,160,' + (n.alpha * 0.6) + ')';
      grd.addColorStop(0, c);
      grd.addColorStop(0.4, n.hue === 30 ? 'rgba(160,100,60,0.015)' : 'rgba(50,40,100,0.01)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.ellipse(n.x, n.y, n.r * (1 + pulse), n.r * 0.65 * (1 - pulse * 0.5), n.phase * 0.1, 0, Math.PI * 2);
      ctx.fill();

      // Drift
      n.x += n.vx;
      n.y += n.vy;
      if (n.x < -n.r) n.x = W + n.r;
      if (n.x > W + n.r) n.x = -n.r;
      if (n.y < -n.r) n.y = H + n.r;
      if (n.y > H + n.r) n.y = -n.r;
    }

    // Star field
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      st.twinkle += st.twinkleSpeed;
      var a = st.alpha * (0.7 + 0.3 * Math.sin(st.twinkle));
      ctx.beginPath();
      ctx.arc(st.x * W, st.y * H, st.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(240,225,200,' + a + ')';
      ctx.fill();
    }

    // Filaments
    for (var f = 0; f < filaments.length; f++) {
      var fl = filaments[f];
      ctx.beginPath();
      ctx.moveTo(fl.x1 * W, fl.y1 * H);
      ctx.lineTo(fl.x2 * W, fl.y2 * H);
      ctx.strokeStyle = 'rgba(196,149,106,' + fl.alpha + ')';
      ctx.lineWidth = fl.width;
      ctx.stroke();
    }

    // Center horizontal glow band
    if (frame % 2 === 0) {
      var cy = H * 0.44;
      var bandGrd = ctx.createLinearGradient(0, cy - 120, 0, cy + 120);
      bandGrd.addColorStop(0, 'rgba(196,149,106,0)');
      bandGrd.addColorStop(0.5, 'rgba(196,149,106,0.022)');
      bandGrd.addColorStop(1, 'rgba(196,149,106,0)');
      ctx.fillStyle = bandGrd;
      ctx.fillRect(0, cy - 120, W, 240);
    }

    frame++;
    requestAnimationFrame(draw);
  }
  draw();

  // ---- Ember dust particles ----
  var dustContainer = document.getElementById('titleDust');
  if (dustContainer) {
    // Clear any old particles
    dustContainer.innerHTML = '';
    for (var d = 0; d < 28; d++) {
      var p = document.createElement('div');
      p.className = 'title-dust-particle';
      var sz = (0.8 + Math.random() * 2.2) + 'px';
      p.style.cssText =
        'left:' + (Math.random() * 100) + '%;' +
        'top:' + (55 + Math.random() * 45) + '%;' +
        'width:' + sz + ';height:' + sz + ';' +
        'animation-duration:' + (10 + Math.random() * 20) + 's;' +
        'animation-delay:' + (Math.random() * 12) + 's;' +
        'opacity:0;';
      dustContainer.appendChild(p);
    }
  }

})();
</script>
