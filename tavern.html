function buildWorldStateAnchor(w) {
  var lines = [];
  lines.push('【世界设定】');
  lines.push('名称：' + w.name);
  lines.push('时代/背景：' + (w.era || '') + ' ' + (w.background || '').slice(0, 120));
  if (w.rules) lines.push('世界规则：' + w.rules.slice(0, 100));
  lines.push('');

  lines.push('【主角档案】');
  var p = w.protagonist;
  lines.push('姓名：' + p.name + ' | 性别：' + p.gender + ' | 年龄：' + p.age);
  if (p.background) lines.push('背景：' + p.background.slice(0, 100));
  if (p.talents && p.talents.length > 0) {
    lines.push('当前天赋：' + p.talents.map(function(t){ return t.name + '(' + t.rarity + '级)'; }).join('、'));
  }
  lines.push('');

  lines.push('【关键角色档案】（角色立场和说话风格不得自行改变）');
  (w.characters || []).forEach(function(c) {
    var aff = typeof c.affection === 'number' ? c.affection : null;
    var attitudeText = '';
    if (aff !== null) {
      if (aff < 30) attitudeText = '疏远/戒备';
      else if (aff < 60) attitudeText = '中立/审视';
      else if (aff < 80) attitudeText = '友好/信任';
      else attitudeText = '亲密/依赖';
    }
    var line = '▸ ' + c.name;
    if (c.job) line += '【' + c.job + '】';
    if (c.relationship) line += ' 与主角关系：' + c.relationship;
    if (attitudeText) line += ' 当前态度：' + attitudeText + '(好感' + aff + ')';
    if (c.personality) line += ' 性格：' + c.personality.slice(0, 40);
    lines.push(line);
  });
  lines.push('');

  if (w.worldSummary) {
    lines.push('【最新剧情摘要】');
    lines.push(w.worldSummary.slice(0, 300));
    lines.push('');
  }

  lines.push('【格式铁则（必须严格执行）】');
  lines.push('1. 纯叙述段落用 [叙述] 开头');
  lines.push('2. 角色对话用 [角色名]: 开头（冒号后有空格，角色名必须是上方档案中的名字）');
  lines.push('3. 回复末尾必须输出 [选项] 区块，格式如下：');
  lines.push('   [选项]');
  lines.push('   1. [倾向] 选项描述（不超过15字）');
  lines.push('   2. [倾向] 选项描述（不超过15字）');
  lines.push('   3. [倾向] 选项描述（不超过15字）');
  lines.push('   • 选项倾向可以是单一标签或组合标签：');
  lines.push('     单一：[安全] [危险] [机遇]');
  lines.push('     组合：[危险+机遇] [安全+机遇] [色情+机遇] [色情+危险] 等（用+号连接两个倾向）');
  lines.push('   • 每个选项的倾向独立随机选择，允许任意组合。但每轮三个选项中必须至少有一个不含[危险]标签的选项（即[安全]、[安全+机遇]、[机遇]等），保证玩家始终有退路。');
  lines.push('   • 【死亡伪装规则】死亡选项必须伪装成正常倾向（如[危险]或[危险+机遇]），绝不要使用[死亡]标签。玩家在选项中看不出哪个会导致死亡——当玩家选中该选项时，你当轮直接输出死亡叙事（包含[DEATH]标记），不要延迟到下一轮。死亡选项出现的频率按难度规则。');
  lines.push('   • 选项的实际结果不一定要和倾向标签一致——[安全]选项也可能出意外，[危险]选项也可能有惊喜，保持不可预测。');
  lines.push('4. 严禁全知视角、严禁预告式叙事、严禁替玩家做决定');
  lines.push('5. 故事到达自然结局时，在叙述末尾添加[FIN]标记（好结局）或[FIN BAD]标记（坏结局）。故事模式按剧情大纲进展，自由模式在关键转折后自然地走向终局。');

  talents.forEach(function(t) {
    if (talentBehaviorMap[t.id]) {
      instructions.push('▸ 天赋[' + t.name + ']激活：' + talentBehaviorMap[t.id]);

// Check and unlock achievements for current world
function checkAchievements(w) {
  if (!w || !state.metaProgression) return;
  var meta = state.metaProgression;
  if (!meta.achievements) meta.achievements = {};
  if (!meta.stats) meta.stats = { totalDeaths:0, totalChars:0, totalWords:0, totalScenes:0, totalKills:0, totalErotic:0, totalTalentsDrawn:0 };
  var unlocked = [];
  achievementDefs.forEach(function(a){
    if (meta.achievements[a.id]) return; // already unlocked
    try {
      if (a.check(w)) {
        meta.achievements[a.id] = Date.now();
        var seeds = a.seeds || 1;
        meta.seeds = (meta.seeds||0) + seeds;
        unlocked.push({ name:a.name, desc:a.desc, icon:a.icon, seeds:seeds });
      }
    } catch(e) {}
  });
  if (unlocked.length > 0) {
    unlocked.forEach(function(a){
      toast('◆ 成就解锁：' + a.icon + ' ' + a.name + ' — ' + a.desc + '（+' + a.seeds + '命运之种）', 'success', 5000);
    });
    saveState();
    renderAchievementPanel();
  }
}

function unlockGrowthNode(nodeId) {
  var meta = state.metaProgression;
  if (!meta.treeUnlocks) meta.treeUnlocks = {};
  if (meta.treeUnlocks[nodeId]) return false; // already unlocked
  var node = growthTreeNodes.find(function(n){ return n.id===nodeId; });
  if (!node) return false;
  // Check prereq
  if (node.req && !meta.treeUnlocks[node.req]) return false;
  // Check cost
  if ((meta.seeds||0) < node.cost) return false;
  meta.seeds -= node.cost;
  meta.treeUnlocks[nodeId] = true;
  saveState();
  toast('⊞ 解锁：' + node.name + '（-' + node.cost + '命运之种）', 'success');
  return true;
}

function resetFateTree() {
  var meta = state.metaProgression;
  var totalRefund = 0;
  if (meta.treeUnlocks) {
    Object.keys(meta.treeUnlocks).forEach(function(key){
      if (meta.treeUnlocks[key]) {
        var node = growthTreeNodes.find(function(n){ return n.id===key; });
        if (node) totalRefund += node.cost;
      }
    });
  }
  if (totalRefund === 0) { toast('没有可重置的节点', 'info'); return; }
  if (!confirm('确定重置命运之树？将返还「'+totalRefund+' ⊞」命运之种。')) return;
  meta.seeds = (meta.seeds||0) + totalRefund;
  meta.treeUnlocks = {};
  saveState();
  renderFateBook();
  toast('⊞ 已重置，返还 '+totalRefund+' 颗命运之种', 'success');
}
function fateUnlockSkill() {
  var meta = state.metaProgression;
  if ((meta.seeds||0) < 3) { toast('命运之种不足（需要3颗）', 'error'); return; }
  var locked = skillPoolDefs.filter(function(s){ return s.unlock && (state.unlockedSkills||[]).indexOf(s.name)<0; });
  if (locked.length === 0) { toast('所有技能已解锁！', 'info'); return; }
  meta.seeds -= 3;
  var pick = locked[Math.floor(Math.random()*locked.length)];
  if (!state.unlockedSkills) state.unlockedSkills = [];
  state.unlockedSkills.push(pick.name);
  saveState();
  renderFateBook();
  toast('⊞ 解锁技能：' + pick.name + '（' + pick.rarity + '）', 'success');
}
function fateUnlockTalent() {
  var meta = state.metaProgression;
  if ((meta.seeds||0) < 5) { toast('命运之种不足（需要5颗）', 'error'); return; }
  var locked = talentPool.filter(function(t){ return t.unlock && (state.unlockedTalents||[]).indexOf(t.id)<0; });
  if (locked.length === 0) { toast('所有天赋已解锁！', 'info'); return; }
  meta.seeds -= 5;
  var pick = locked[Math.floor(Math.random()*locked.length)];
  state.unlockedTalents.push(pick.id);

// Apply growth tree bonuses to new world
function applyGrowthBonuses(w) {
  var meta = state.metaProgression;
  if (!meta.treeUnlocks) return;
  var unlocks = meta.treeUnlocks;
  growthTreeNodes.forEach(function(node){
    if (!unlocks[node.id]) return;
    var e = node.effect;
    // Talent branch
    if (e.drawBonus) w.protagonist.drawCount = (w.protagonist.drawCount||3) + e.drawBonus;
    if (e.slotBonus) w.protagonist.maxSlots = (w.protagonist.maxSlots||3) + e.slotBonus;
    if (e.rerollBonus) w.protagonist._rerolls = (w.protagonist._rerolls||0) + e.rerollBonus;
    if (e.rarityBonus) w._rarityBoost = (w._rarityBoost||0) + e.rarityBonus;
    if (e.refreshTalent) w.protagonist._canRefreshTalent = true;
    if (e.doublePick) w.protagonist._doublePick = true;
    // World branch
    if (e.startItem && !w.protagonist._initItems) w.protagonist._initItems = [];
    if (e.startItem) for (var i=0;i<e.startItem;i++) w.protagonist._initItems.push({name:'随机道具',desc:'命运之种赠礼'});
    if (e.affBonus) w._affectionBonus = (w._affectionBonus||0) + e.affBonus;
    if (e.hellPlus) w._hellPlus = true;
    if (e.customStyle) w._customStyleUnlocked = true;
    if (e.guideNPC) w._guideNPC = true;
    if (e.worldEcho) w._worldEcho = true;
    // Protag branch
    if (e.startBlessed) w.protagonist.status = 'blessed';
    if (e.startBlessedPlus) { w.protagonist.status = 'blessed'; w.protagonist._superBlessed = true; }
    if (e.startSkill) { if (!w.protagonist._bonusSkills) w.protagonist._bonusSkills = []; w.protagonist._bonusSkills.push('extra'); }
    if (e.startGold) w.protagonist._startGold = (w.protagonist._startGold||0) + e.startGold * 100;
    if (e.memorySkill) w.protagonist._memorySkill = true;
    if (e.startGear) { if (!w.protagonist._bonusGear) w.protagonist._bonusGear = []; w.protagonist._bonusGear.push('gear'); }
  });
}

// ===== STATE PERSISTENCE =====
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      state = { ...state, ...s };
      // Ensure chatHistory exists for all worlds
      if (!state.chatHistory) state.chatHistory = {};
      state.worlds.forEach(w => {
        if (!state.chatHistory[w.id]) state.chatHistory[w.id] = [];
        // Migrate: ensure new fields exist
        if (w.worldSummary === undefined) w.worldSummary = '';
        if (!w.saves) w.saves = { manual: null, auto: null };
        // Migrate old w.saves.manual (single) to w.saves.manualList (array)
        if (w.saves.manual && !w.saves.manualList) {
          w.saves.manualList = [{
            id: w.saves.manual.time || Date.now(),
            label: '存档1',
            time: w.saves.manual.time || Date.now(),
            msgCount: w.saves.manual.msgCount || 0,
            snapshot: w.saves.manual.snapshot || null
          }];
        }
        // Ensure manualList exists
        if (!w.saves.manualList) w.saves.manualList = [];
        // Migrate character fields
        if (w.characters) w.characters.forEach(c => {
          if (c.affection === undefined) c.affection = 50;
          if (c.lewdness === undefined) c.lewdness = 0;
          if (!c.kinks) c.kinks = [];
        });
        // Migrate: backfill seenSkills from existing protagonists
        if (!state.seenSkills) state.seenSkills = [];
        if (w.protagonist && w.protagonist.skill) {
          if (state.seenSkills.indexOf(w.protagonist.skill) < 0) state.seenSkills.push(w.protagonist.skill);
        }
        // Migrate: backfill sealedTalents from existing protagonists (only non-locked ones)
        if (!state.sealedTalents) state.sealedTalents = [];
        if (w.protagonist && w.protagonist.talents) {
          w.protagonist.talents.forEach(function(t){
            if (state.sealedTalents.indexOf(t.id) < 0) {
              // Only add if the talent doesn't need unlocking, or is already unlocked
              var talentDef = talentPool.find(function(td){ return td.id === t.id; });
              if (!talentDef || !talentDef.unlock || state.unlockedTalents.indexOf(t.id) >= 0) {
                state.sealedTalents.push(t.id);
              } else {
                // Remove locked talent from protagonist too
                var idx = w.protagonist.talents.indexOf(t);
                if (idx >= 0) w.protagonist.talents.splice(idx, 1);
              }
            }
          });
        }
      });
      // Clean up: remove incomplete worlds (never started adventure)
      state.worlds = state.worlds.filter(function(sw){
        return sw._started || (state.chatHistory[sw.id] && state.chatHistory[sw.id].length > 0);
      });
    }
  } catch (e) { /* ignore parse errors */ }
}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    toast('保存失败：本地存储空间不足', 'error');
  }
}

    name: w.name,
    createdAt: new Date().toISOString(),

    worldSummary: w.worldSummary || '',
    protagonist: JSON.parse(JSON.stringify(w.protagonist)),

function hideWorldBooks() {
  var el = document.getElementById('wbOverlay');
  if (el) el.style.display = 'none';
}

function loadWorldBook(idx) {
  var b = (state.worldBooks||[])[idx];
  if (!b) return;
  hideWorldBooks();
  // Create a new world from the book
  var w = blankWorld();
  w.name = b.name + '（副本）';
  w.mode = b.mode;
  w.difficulty = b.difficulty;
  w.length = b.length;
  w.background = b.background;
  w.era = b.era;
  w.rules = b.rules;
  w.customStyle = b.customStyle;
  w.styleTags = b.styleTags.slice();
  w.nsfwStyle = b.nsfwStyle;
  w.allowNSFW = b.allowNSFW;
  w.worldComplexity = b.worldComplexity;
  w.worldSummary = b.worldSummary;
  w.protagonist = JSON.parse(JSON.stringify(b.protagonist));
  w.characters = JSON.parse(JSON.stringify(b.characters));
  w.stats = JSON.parse(JSON.stringify(b.stats || []));
  w.wordLimit = b.wordLimit || 2000;
  w.powerLevel = b.powerLevel || 'Lv1';
  w.writingRules = b.writingRules || '';
  w.protagonist.talents = []; // reset talents
  w.protagonist.drawCount = 3;
  state.worlds.push(w);
  state.activeWorldId = w.id;
  state.chatHistory[w.id] = [];
  // Apply growth tree bonuses
  applyGrowthBonuses(w);
  saveState();
  enterGame();
  showPanel('wizard');
  toast('◉ 已从世界之书创建新世界：' + esc(w.name), 'success');
}

function deleteWorldBook(idx) {
  if (!confirm('确定删除这本世界之书？')) return;
  state.worldBooks.splice(idx, 1);
  saveState();
  showWorldBooks();
  toast('世界之书已删除', 'info');
}

function getActiveWorld() {
  return state.worlds.find(w => w.id === state.activeWorldId) || null;
}

// ===== HELPERS =====
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ===== QUICK PROMPT MODAL (replaces native prompt()) =====
function showQuickPrompt(msg, defVal, cb) {
  var overlay = document.getElementById('quickPromptOverlay');
  if (overlay) overlay.remove();
  overlay = document.createElement('div');
  overlay.id = 'quickPromptOverlay';
  overlay.className = 'quick-prompt-overlay';

}

// ===== TOAST SYSTEM =====
function toast(msg, type) {
  type = type || 'info';
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  c.appendChild(el);

}

function closeSidebar() {

// ===== PANEL SWITCHING =====
// Show a panel from the TITLE SCREEN (hides sidebar, no game UI)
function showTitlePanel(panelName) {
  // Remember where we came from
  var ts = document.getElementById('titleScreen');
  state._panelFromTitle = (ts && ts.style.display !== 'none');
  if (ts) ts.style.display = 'none';
  var app = document.querySelector('.app');
  if (app) app.style.display = 'flex';
  // Hide sidebar and toggle
  var sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.style.display = 'none';
  var st = document.getElementById('sidebarToggle');
  if (st) st.style.display = 'none';
  // Show only the target panel
  document.querySelectorAll('.panel').forEach(function(p) {
    p.classList.toggle('active', p.id === 'panel-' + panelName);
  });
}
// Go back from title panels — return to title OR in-game depending on context
function goBackToTitle() {
  if (state._panelFromTitle) {
    // Came from title screen
    var ts = document.getElementById('titleScreen');
    if (ts) ts.style.display = 'flex';
    var app = document.querySelector('.app');
    if (app) app.style.display = 'none';
  } else {
    // Came from in-game — restore game
    var sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.style.display = '';
    var st = document.getElementById('sidebarToggle');
    if (st) st.style.display = '';
    showPanel('chat');
    renderAll();
    updateSpeakerTag();
  }
  state._panelFromTitle = false;
}
function showPanel(name) {
  // Update panels
  document.querySelectorAll('.panel').forEach(function (p) {
    p.classList.toggle('active', p.id === 'panel-' + name);
  });
  closeSidebar();

  // Re-render the target panel with latest data
  var w = getActiveWorld();
  if (name === 'chat' && w) {
    renderScene(w);
    renderChatLog();
    renderSidePanel();
    updateSpeakerTag();
    setupDiceModeUI();
  } else if (name === 'chat') {
    renderSidePanel();
  } else if (name === 'wizard') {
    // Bug fix: always re-render wizard when switching to it
    renderWizard(w);
  } else if (name === 'settings') {
    renderSettings();
  }
}

// ===== RENDER: MASTER =====
function renderAll() {
  renderWorldList();
  renderSpeakerList();
  updateTopWorldCard();
  var w = getActiveWorld();
  if (w) {
    renderScene(w);
    renderCheckpointBar(w);
  }
  renderChatLog();
  renderSidePanel();
  // Only re-render wizard/settings if their panels are visible
  var wizardPanel = document.getElementById('panel-wizard');
  if (wizardPanel.classList.contains('active')) {
    renderWizard(w);
  }
  var settingsPanel = document.getElementById('panel-settings');
  if (settingsPanel.classList.contains('active')) {

  }
}

// ===== RENDER: WORLD LIST =====
function renderWorldList() {
  var el = document.getElementById('worldList');
  if (state.worlds.length === 0) {
    el.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:16px 8px;font-size:11px">点 + 创建世界</div>';
    return;
  }
  var w = getActiveWorld();
  var showingAll = state._showAllWorlds;
  if (showingAll) {
    // Show only started worlds
    var startedWorlds = state.worlds.filter(function(sw){ return sw._started || (state.chatHistory[sw.id] && state.chatHistory[sw.id].length > 0); });
    if (startedWorlds.length === 0) {
      el.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:16px 8px;font-size:11px">还没有开始冒险的世界</div>';
    } else {
      el.innerHTML = startedWorlds.map(function (sw) {
      var isActive = sw.id === state.activeWorldId;
      return '<div class="world-card' + (isActive ? ' active' : '') + '" onclick="selectWorld(\'' + esc(sw.id) + '\')">'
        + '<h3>' + esc(sw.name) + '</h3>'
        + '<div class="meta">' + sw.characters.length + ' 角色 · ' + (sw.era || '时') + '</div>'
        + '</div>';
    }).join('')
    + '<div style="text-align:center;margin-top:8px"><button class="btn btn-sm btn-ghost" onclick="state._showAllWorlds=false;saveState();renderWorldList()">收起 ↑</button></div>';
    }
  } else {
    // Show only active world
    if (!w) {
      el.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px;font-size:12px">请选择一个世界</div>';
      return;
    }
    var icon = getWorldIcon(w);
    el.innerHTML = '<div class="world-card active" onclick="selectWorld(\'' + esc(w.id) + '\')">'
      + '<h3>' + icon + ' ' + esc(w.name) + '</h3>'
      + '<div class="meta">' + w.characters.length + ' 角色 · ' + (w.era || '时代未定') + '</div>'
      + '<div class="actions" style="gap:4px">'
      + '<button class="btn btn-sm" onclick="event.stopPropagation();editWorld(\'' + esc(w.id) + '\')">编辑</button>'
      + '<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteWorld(\'' + esc(w.id) + '\')">删</button>'
      + '</div></div>'
      + '<div style="text-align:center;margin-top:8px"><button class="btn btn-sm btn-ghost" onclick="state._showAllWorlds=true;saveState();renderWorldList()">所有世界 ↓</button></div>';
  }
}

function getWorldIcon(w) {
  // Prefer explicit icon field; fall back to era-based guess
  if (w && w.icon) return w.icon;
  var era = (w.era || '').toLowerCase();
  if (era.includes('古代') || era.includes('修真') || era.includes('仙侠')) return '↻';
  if (era.includes('现代') || era.includes('都市')) return '⊞';
  if (era.includes('未来') || era.includes('赛博')) return '◌';
  if (era.includes('魔法') || era.includes('幻想')) return '▢';
  if (era.includes('末日') || era.includes('废土')) return '◫';
  return '⊕';
}

// ===== RENDER: CHAT LOG =====
function renderChatLog() {
  var el = document.getElementById('chatLog');
  var hid = state.activeWorldId || 'global';
  var log = state.chatHistory[hid] || [];

  if (log.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">◫</div><p>选择一个世界，开始你的故事。</p></div>';
    return;
  }

  // Merge consecutive narrate messages into single blocks with paragraph spacing
  var displayLog = [];
  for (var i = 0; i < log.length; i++) {
    var m = log[i];
    if (m.type === 'narrate' && displayLog.length > 0 && displayLog[displayLog.length - 1].type === 'narrate-merged') {
      displayLog[displayLog.length - 1].text += '\n\n' + m.text;
    } else if (m.type === 'narrate') {
      displayLog.push({ type: 'narrate-merged', text: m.text });
    } else {
      displayLog.push(m);
    }
  }

  el.innerHTML = displayLog.map(function (m) {
    var msgHtml = '';
    if (m.type === 'typing') {
      msgHtml = '<div class="msg msg-typing"><span></span><span></span><span></span></div>';
    } else if (m.type === 'narrate-merged') {
      msgHtml = '<div class="msg msg-narrate">' + esc(m.text) + '</div>';
    } else if (m.type === 'narrate') {
      msgHtml = '<div class="msg msg-narrate">' + esc(m.text) + '</div>';
    } else if (m.type === 'system') {
      msgHtml = '<div class="msg msg-system">' + esc(m.text) + '</div>';
    } else {
      msgHtml = '<div class="msg msg-speech ' + (m.isUser ? 'user' : 'npc') + '">'
      + '<div class="who" style="color:' + (m.isUser ? 'var(--accent2)' : 'var(--accent)') + '">'
      + esc(m.speaker) + '</div>'
      + '<div class="body">' + esc(m.text) + '</div>'
      + '</div>';
    }
    return msgHtml;
  }).join('');

  // Scroll to bottom
  requestAnimationFrame(function () {
    el.scrollTop = el.scrollHeight;
  });
}

function getWizardStep(w) {
  if (!wizardStepState[w.id]) wizardStepState[w.id] = 0;
  return wizardStepState[w.id];
}

function setWizardStep(w, step) {
  var visibleSteps = wizardSteps.filter(function(s){ return s.id !== 'nsfw' || w.allowNSFW; });
  wizardStepState[w.id] = Math.max(0, Math.min(visibleSteps.length - 1, step));
  renderWizard(w);
}

function wizNext() {
  var w = getActiveWorld(); if (!w) return;
  wizAutoSave(getWizardStep(w));
  setWizardStep(w, getWizardStep(w) + 1);
}

function wizPrev() {
  var w = getActiveWorld(); if (!w) return;
  wizAutoSave(getWizardStep(w));
  setWizardStep(w, getWizardStep(w) - 1);
}

function wizAutoSave(stepIdx) {
  var step = wizardSteps[stepIdx];
  if (!step) return;
  var w = getActiveWorld(); if (!w) return;

  switch (step.inputType) {
    case 'tagged':
      var el = document.getElementById('wiz-input');
      if (el) w.background = el.value;
      if (step.id === 'bg') {
        var nameEl = document.getElementById('wiz-world-name');
        if (nameEl && nameEl.value.trim()) w.name = nameEl.value.trim();
      }
      break;
    case 'input':
      var el2 = document.getElementById('wiz-input');
      if (el2 && step.id === 'era') w.era = el2.value;
      break;
    case 'protagonist':
      var n = document.getElementById('wiz-protag-name');
      var d = document.getElementById('wiz-protag-desc');
      if (n) w.protagonist.name = n.value;
      if (d) w.protagonist.desc = d.value;
      break;
    case 'attributes':
      break; // merged into protagonist2
    case 'protagonist2':
      var pn = document.getElementById('wiz-p-name');
      var pg = document.getElementById('wiz-p-gender');
      var pa = document.getElementById('wiz-p-age');
      var pb = document.getElementById('wiz-p-bg');
      if (pn) w.protagonist.name = pn.value;
      if (pg) w.protagonist.gender = pg.value;
      if (pa) w.protagonist.age = parseInt(pa.value) || 18;
      if (pb) w.protagonist.background = pb.value;
      break;
    case 'style':
      var s = document.getElementById('wiz-style');
      if (s) w.customStyle = s.value;
      break;
  }
  saveState();
  renderScene(w);
  renderWorldList();
}

// Tag state is stored per world: w._tags[stepId] = [tag1, tag2, ...]
function wizGetTags(stepId) {
  var w = getActiveWorld(); if (!w) return [];
  if (!w._tags) w._tags = {};
  if (!w._tags[stepId]) w._tags[stepId] = [];
  return w._tags[stepId];
}

function wizTagClick(stepId, tag, isSingle) {
  var w = getActiveWorld(); if (!w) return;
  var tags = wizGetTags(stepId);
  var idx = tags.indexOf(tag);

  if (isSingle) {
    // Single-select: clicking same tag deselects, otherwise replace
    if (idx >= 0) {
      w._tags[stepId] = [];
    } else {
      w._tags[stepId] = [tag];
    }
  } else {
    // Multi-select: toggle
    if (idx >= 0) {
      tags.splice(idx, 1);
    } else {
      tags.push(tag);
    }
  }
  saveState();
  renderWizard(w);
}

// Protagonist-specific tag toggle
function wizProtagTag(key, tag) {
  var w = getActiveWorld(); if (!w) return;
  var p = w.protagonist;
  if (!p._tags) p._tags = {};
  if (!p._tags[key]) p._tags[key] = [];
  var idx = p._tags[key].indexOf(tag);
  if (idx >= 0) { p._tags[key].splice(idx,1); }
  else { p._tags[key].push(tag); }
  saveState(); renderWizard(w);
}

function sanitizeJson(raw) {
  var t = (raw||'')
    // 彻底清理 markdown 代码块标记（各种变体）
    .replace(/^[\s\S]*?```(?:json|js|javascript)?\s*\n?/i,'')
    .replace(/\n?\s*```[\s\S]*$/,'')
    .replace(/```\s*/g,'')
    .trim();
  // 如果还有残存的反引号行，全面移除
  t = t.replace(/^`{1,3}\s*/gm,'').replace(/\s*`{1,3}$/gm,'').trim();
  var s = t.indexOf('{'), e = t.lastIndexOf('}');
  if (s >= 0 && e > s) { t = t.slice(s, e+1); }
  else if (s >= 0 && e <= s) {
    // 有开括号无闭括号 ‣ AI被截断了，尝试补全
    t = t.slice(s);
    // 统计未闭合的 { 和 [
    var braceCount = 0, bracketCount = 0, inStr = false, escaped = false;
    for (var i = 0; i < t.length; i++) {
      var ch = t[i];
      if (escaped) { escaped = false; continue; }
      if (ch === '\\') { escaped = true; continue; }
      if (ch === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (ch === '{') braceCount++;
      if (ch === '}') braceCount--;
      if (ch === '[') bracketCount++;
      if (ch === ']') bracketCount--;
    }
    // 如果最后一个字符不是逗号，先加逗号（安全补全）
    var lastChar = t.replace(/\s+$/,'').slice(-1);
    if (lastChar === ',' || lastChar === ':' || lastChar === '{' || lastChar === '[') {
      // 被截断在不完整位置 ‣ 去掉最后的不完整片段
      var lastComma = t.lastIndexOf(',');
      if (lastComma > t.indexOf('{') + 1) t = t.slice(0, lastComma);
    }
    // 补缺失的括号和方括号
    while (braceCount > 0) { t += '}'; braceCount--; }
    while (bracketCount > 0) { t += ']'; bracketCount--; }
  }
  else { return ''; }
  // 修复尾随逗号
  t = t.replace(/,\s*}/g, '}').replace(/,\s*]/g, ']');
  return t;
}

function extractFieldsFallback(jsonText) {
  // 正则兜底: 逐个提取字段值，容错性最强
  var o = {};
  var fields = ['name','age','gender','relationship','race','job','level',
    'personality','appearance','clothing','currentAction','shortTermGoal',
    'longTermGoal','thoughts','sexualExperience','background','affection',
    'lewdness','kinks'];
  fields.forEach(function(f) {
    // 匹配 "field": 后跟的值，支持双引号字符串、数字、数组
    var re = new RegExp('"?'+f+'"?'+'\\s*\\:\\s*');
    var idx = jsonText.search(re);
    if (idx < 0) return;
    var rest = jsonText.slice(idx).replace(re, '');
    if (f === 'kinks') {
      var arrMatch = rest.match(/^\[[\s\S]*?\]/);
      if (arrMatch) { try { o[f] = JSON.parse(arrMatch[0]); } catch(e) { o[f] = []; } }
      else o[f] = [];
      return;
    }
    if (f === 'affection' || f === 'lewdness') {
      var nm = rest.match(/^(\d+)/);
      o[f] = nm ? parseInt(nm[1]) : (f==='affection'?50:0);
      return;
    }
    // 字符串值: 优先匹配双引号字符串
    var strMatch = rest.match(/^"((?:[^"\\]|\\.)*)"/);
    if (strMatch) { o[f] = strMatch[1]; return; }
    // 无引号字符串值（到逗号或}）
    var rawMatch = rest.match(/^([^,}]+)/);
    if (rawMatch) { o[f] = rawMatch[1].trim(); }
  });
  return o;
}

function callAI(prompt, callback) {
  var w = getActiveWorld(); if (!w) return;

  .then(function(r){
    if(!r.ok) return r.text().then(function(b){
      var m='HTTP '+r.status;try{var j=JSON.parse(b);if(j.error&&j.error.message)m=j.error.message;}catch(e){}

}

  input.style.cssText = 'font-size:14px;font-weight:600;padding:2px 6px;margin:0;width:100%;font-family:var(--font-ui)';
  nameEl.replaceWith(input);
  input.focus();
  input.select();
  function finish() {
    var newName = input.value.trim() || oldName;
    w.name = newName;
    saveState();
    renderWorldList();
    var nw = getActiveWorld();
    if (nw && nw.id === id) renderSidePanel();
  }
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = oldName; input.blur(); }
  });
}

function addTypingIndicator(w) {
  var hid = w.id;
  if (!state.chatHistory[hid]) state.chatHistory[hid] = [];
  _typingId = Date.now();
  state.chatHistory[hid].push({ type: 'typing', id: _typingId });
  renderChatLog();
}
function removeTypingIndicator(w) {
  var hid = w.id;
  if (!state.chatHistory[hid]) return;
  state.chatHistory[hid] = state.chatHistory[hid].filter(function(m){ return m.type !== 'typing'; });
  renderChatLog();
}

function restoreInput() {
  var inp = document.getElementById('chatInput');
  if (!inp) return;
  inp.disabled = false;
  inp.placeholder = '输入叙述、对话或行动…';
  inp.focus();
  var sendBtn = document.querySelector('.btn-accent[onclick*="sendChat"]');
  if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = '‣'; }
}

function sendChat() {
  var inp = document.getElementById('chatInput');
  var text = inp.value.trim();
  if (!text) return;

  var w = getActiveWorld();
  if (!w) {
    toast('请先选择一个世界', 'error');
    return;
  }

  // Disable input during AI processing
  inp.disabled = true;
  inp.value = '';
  inp.placeholder = 'AI 正在思考…';
  var sendBtn = document.querySelector('.btn-accent[onclick*="sendChat"]');
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = '⏳'; }
  clearOptionCards();
  var speaker = state.activeSpeaker;
  var displayName = speaker || '你';

  // Add user message
  addChatSpeech(w, displayName, text, true);

  // Add typing indicator
  addTypingIndicator(w);

  // Auto-checkpoint every 5 user messages in story mode
  // Auto-checkpoint every 5 user messages (all modes)
  var log = state.chatHistory[w.id] || [];
  var userMsgs = log.filter(function(m){return m.isUser;}).length;
  if (userMsgs > 0 && userMsgs % 5 === 0) {
    saveCheckpoint(w, log.length, '自动存档 #' + (userMsgs/5));
  }

  // Auto-save every 3 user messages
  (function () {
    var log = state.chatHistory[w.id] || [];
    var userMsgs = log.filter(function(m){return m.isUser;}).length;
    if (userMsgs > 0 && userMsgs % 3 === 0) {
      autoSave();
    }
  })();

  // Tick talent cooldowns after sending
  tickCooldowns();

  // No API key: local fallback
  if (!state.apiKey) {
    localResponse(w, text, speaker);
    return;
  }

  // Build prompt with context
  var log = state.chatHistory[w.id] || [];
  var recentLog = log.slice(-12).map(function (m) {
    if (m.type === 'narrate') return '[叙述] ' + m.text;
    if (m.type === 'system') return '';
    return '[' + m.speaker + ']: ' + m.text;
  }).filter(Boolean).join('\n');

  var charsContext = w.characters.map(function (c) {
    return c.name + '(' + (c.tag || '') + '): ' + (c.desc || '');
  }).join('; ');
  var styleStr = w.styleTags.join('、') || '自然流畅';

  var systemPrompt = '你是一个小说世界的互动叙事引擎。当前世界：' + w.name + '。背景：' + (w.background || '') + '。规则：' + (w.rules || '') + '。文风：' + styleStr + '。';
  if (w.powerLevel) systemPrompt += buildPowerLevelRule(w.powerLevel, true);
  if (w.customStyle) systemPrompt += ' 额外风格要求：' + w.customStyle + '。';
  if (w._customRule) systemPrompt += '【创世规则——必须严格遵守】' + w._customRule + '。';
  systemPrompt += ' 【写作铁则——必须严格遵守以下每条规则】' + (w.writingRules || defaultWritingRules);
  // Story mode rules
  if (w.mode === 'story') {
    systemPrompt += ' 模式：攻略之书（' + ({short:'短篇',medium:'中篇',long:'长篇'})[w.length] + '，' + ({easy:'简单',normal:'普通',hard:'困难',hell:'地狱'})[w.difficulty] + '难度）。';
    systemPrompt += ' 核心规则（全难度强制）：玩家行为必须严格符合角色人设、能力层级、世界规则。不能言出法随、篡改设定、打破第四面墙、或使用角色不具备的能力。每个行动必须有合理的动机和因果链条。';
    systemPrompt += ' 难度差异：' + ({easy:'叙事轻松——局势明朗，配角友善，线索清晰。',normal:'叙事平衡——局势复杂，配角各有立场，线索需推理。',hard:'叙事严苛——多方势力明争暗斗，人心难测，线索稀少且可能误导。',hell:'叙事残酷——满盘皆敌，信任是奢侈品，每条线索都可能通向陷阱。'})[w.difficulty];
    systemPrompt += ' 死亡规则：当主角遇到不可避免的致命情况时，请输出[DEATH]标记。' + ({easy:'简单难度主角极难死亡——会有各种巧合、NPC援救、运气成分让主角化险为夷。除非玩家连续做出极其愚蠢的决策，否则不要触发死亡。',normal:'普通难度主角会面临真实危险，但在绝境中仍有逃生可能。触发[DEATH]前给玩家一个逃脱窗口。',hard:'困难难度死亡是真实威胁。失误会导致严重后果。触发[DEATH]时玩家只能回档到上一个存档点。',hell:'地狱难度死亡即永久删档。触发[DEATH]前给出明确警告。一旦[DEATH]触发，该世界将被删除，所有进度清零。'})[w.difficulty];
    systemPrompt += ' 死亡选项规则（按难度）：死亡选项必须伪装成[危险]或[危险+机遇]倾向，绝不使用[死亡]标签。玩家看不出哪个选项致命——选中后当轮直接输出死亡叙事（含[DEATH]标记）。' + ({easy:'简单难度死亡选项极难出现——仅当玩家连续5轮以上选危险行动后，才可伪装一个。',normal:'普通难度在剧情进入高危场景时（生死对峙、绝境突围等），可伪装死亡选项。',hard:'困难难度每8-10轮可伪装一个死亡选项，高风险场景中[危险]和[危险+机遇]倾向频出。',hell:'地狱难度死亡如影随形——[危险]倾向占多数，死亡伪装随时可能出现。'})[w.difficulty];
    systemPrompt += ' 选项保底规则（全难度强制）：每轮三个选项中必须至少有一个不含[危险]标签的选项（[安全]、[安全+机遇]、[机遇]等），保证玩家在任何难度下始终有一条可选的退路。';
    systemPrompt += ' 选项倾向频率（按难度）：' + ({easy:'简单难度选项倾向以[安全]和[安全+机遇]为主，[危险]不超过1/3，其中偶尔伪装死亡选项。',normal:'普通难度选项倾向均衡——[安全][危险][机遇]大体均匀分布，组合倾向偶尔出现，高危场景中一个[危险]或[危险+机遇]可能是伪装死亡。',hard:'困难难度选项倾向以[危险]和[危险+机遇]为主，[安全]倾向不超过1/3。玩家需警惕：一些看似普通的[危险]选项实际导向死亡。',hell:'地狱难度选项以[危险][危险+机遇]为主，[安全]极稀少。几乎每个[危险]选项都可能是死亡陷阱。'})[w.difficulty];
    if (w.plotNodes && w.plotNodes.length > 0) systemPrompt += ' 剧情节点大纲：' + JSON.stringify(w.plotNodes) + '。请引导故事向这些节点推进，但保留玩家的选择自由。';
    systemPrompt += ' 结局规则：当剧情自然推进到终局时，在叙述末尾添加[FIN]标记（好结局/通关）或[FIN BAD]标记（坏结局）。' + ({short:'短篇约20轮后开始考虑收束',medium:'中篇约35轮后开始收束',long:'长篇约50轮后开始收束'})[w.length] + '。自由模式同样可以在关键转折后走向结局。';
  } else if (w.mode === 'dice') {
    systemPrompt += ' 模式：交给骰子（骰子随机生成世界，' + ({short:'短篇',medium:'中篇',long:'长篇'})[w.length] + '，' + ({easy:'简单',normal:'普通',hard:'困难',hell:'地狱'})[w.difficulty] + '难度）。由AI补充世界细节并推进剧情，世界设定仅为起点。';
    if (w.plotNodes && w.plotNodes.length > 0) systemPrompt += ' 剧情节点大纲：' + JSON.stringify(w.plotNodes) + '。请引导故事向这些节点推进，但保留玩家的选择自由。';
    systemPrompt += ' 结局规则：当剧情自然推进到终局时，在叙述末尾添加[FIN]标记（好结局/通关）或[FIN BAD]标记（坏结局）。' + ({short:'短篇约20轮后开始考虑收束',medium:'中篇约35轮后开始收束',long:'长篇约50轮后开始收束'})[w.length] + '。';
  } else {
    systemPrompt += ' 模式：自由探索。完全自由，无限制，AI可以自由发挥创造剧情和事件。';
  }
  if (w.allowNSFW) {
    systemPrompt += ' 性描写：已启用(' + w.nsfwLevel + ')。';
    if (w.nsfwStyle) {
      var nsfwSp = nsfwStylePresets.find(function(ns){return ns.id===w.nsfwStyle;});
      if (nsfwSp) systemPrompt += ' 性描写风格：' + nsfwSp.prompt;
    } else {
      systemPrompt += ' 描写时使用正常人的语言，避免医学术语。';
    }
    systemPrompt += ' 【色情选项规则】当你判断当前场景的情色时机自然成熟时，可以将选项倾向替换为包含[色情]的组合，如[色情+机遇][色情+危险]等（仍保持3个选项总数）。色情选项与其他选项一样具有不确定性——它可能推进亲密关系让某角色好感度上升，也可能因冒犯或误判导致好感度降低、惹怒对方、或让局势恶化。色情内容应自然融入世界观和角色性格，不要生硬插入。';
  } else {
    systemPrompt += ' 性描写：已禁用。遇到性相关内容请含蓄处理或跳过。';
  }
  systemPrompt += ' 用户现在操控' + w.protagonist.name + '。' + (speaker ? '当前对话对象是' + speaker + '。' : '') + '用中文回复。';

  // Feature 4: Word limit
  var wl = w.wordLimit || 2000;
  systemPrompt += ' 本次回复字数控制在约' + wl + '字左右。';

  var worldAnchor = buildWorldStateAnchor(w);
  var talentInstructions = buildTalentInstructions(w);
  var userActionMsg = recentLog + '\n' + (speaker ? '[' + speaker + ']接下来请回应' : '请叙述接下来发生什么');
  if (talentInstructions) userActionMsg += '\n\n' + talentInstructions;

  fetch(state.apiUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + state.apiKey,
    },
    body: JSON.stringify({
      model: state.apiModel,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: worldAnchor },
        { role: 'assistant', content: '已读取世界状态档案。我将严格按照格式铁则和角色档案生成内容，不会偏离设定。' },
        { role: 'user', content: userActionMsg },
      ],
      temperature: 0.85,
      max_tokens: Math.min(4096, Math.max(800, wl * 2)),
    }),
  })
  .then(function (res) {
    if (!res.ok) {
      return res.text().then(function (body) {
        var errMsg = 'HTTP ' + res.status;
        try { var j = JSON.parse(body); if (j.error && j.error.message) errMsg = j.error.message; else if (j.message) errMsg = j.message; } catch(e) {}
        throw new Error('API 错误: ' + errMsg);
      });
    }
    return res.json();
  })
  .then(function (data) {
    removeTypingIndicator(w);
    restoreInput();
    var reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    if (data.choices && data.choices[0] && data.choices[0].finish_reason === 'length') {
      addChatSystem(w, '‡ AI回复被截断（字数上限不够）。建议调高字数滑块，或输入"继续"。');
    }
    parseAIResponse(w, reply);
    // Check achievements after every AI response
    checkAchievements(w);
    var log = state.chatHistory[w.id] || [];
    var userMsgs = log.filter(function(m){return m.isUser;}).length;
    if (userMsgs > 0 && userMsgs % 5 === 0) {
      generateSummary(w);
    }
  })
  .catch(function (e) {
    removeTypingIndicator(w);
    restoreInput();
    addChatSystem(w, 'AI 响应失败: ' + e.message);
  });
}

function parseAIResponse(w, text) {
  // Check for scene update markers
  var sceneMatch = text.match(/\[场景[：:]\s*(.+?)\]/);
  if (sceneMatch && w.protagonist) {
    w.protagonist.currentScene = sceneMatch[1].trim();
    trackSceneVisit(w, sceneMatch[1].trim());
  }

  // Check for protagonist state updates
  var statusMatch = text.match(/\[主角状态[：:]\s*(.+?)\]/);
  if (statusMatch && w.protagonist) {
    w.protagonist.status = statusMatch[1].trim();
  }
  var effectMatch = text.match(/\[状态效果[：:]\s*(.+?)\]/);
  if (effectMatch && w.protagonist) {
    w.protagonist.statusEffects = effectMatch[1].split(/[,，、]/).map(function(s){ return {name: s.trim(), desc: s.trim()}; });
  }
  var itemMatch = text.match(/\[获得物品[：:]\s*(.+?)\]/);
  if (itemMatch && w.protagonist && w.protagonist.inventory) {
    var newItems = itemMatch[1].split(/[,，、]/).map(function(s){ return {name: s.trim(), desc: s.trim()}; });
    w.protagonist.inventory = w.protagonist.inventory.concat(newItems);
    // Deduplicate
    var seen = {};
    w.protagonist.inventory = w.protagonist.inventory.filter(function(i){
      if (seen[i.name]) return false;
      seen[i.name] = true;
      return true;
    });
  }

  // Clean scene/protag markers from display text
  text = text.replace(/\[场景[：:][^\]]*\]/g, '').replace(/\[主角状态[：:][^\]]*\]/g, '').replace(/\[状态效果[：:][^\]]*\]/g, '').replace(/\[获得物品[：:][^\]]*\]/g, '');

  // Enhanced option parsing — try JSON format first, then text format
  var options = null;

  // Try JSON format: "options": [{"label":"...","type":"安全"}, ...]
  var jsonOptMatch = text.match(/"options"\s*:\s*(\[[\s\S]*?\])/);
  if (jsonOptMatch) {
    try {
      var parsedOpts = JSON.parse(jsonOptMatch[1]);
      if (Array.isArray(parsedOpts) && parsedOpts.length > 0) {
        var riskMap = { '安全': 'safe', '危险': 'danger', '机遇': 'risky', '色情': 'erotic', '死亡': 'death' };
        options = parsedOpts.map(function(o){
          var rawType = o.type || '';
          // Handle combined types like "危险+机遇"
          if (rawType.indexOf('+') >= 0) {
            var parts = rawType.split('+').map(function(p){ return riskMap[p.trim()] || 'neutral'; });
            // Use the first non-neutral part as primary risk, store all in risks array
            var primary = parts.find(function(p){ return p !== 'neutral'; }) || 'neutral';
            return { text: (o.label || o.text || '').trim(), risk: primary, risks: parts };
          }
          return { text: (o.label || o.text || '').trim(), risk: riskMap[rawType] || 'neutral' };
        });
        // Remove the JSON options block from display text
        text = text.replace(jsonOptMatch[0], '').replace(/,\s*$/, '').trim();
      }
    } catch(e) {}
  }

  // Fallback: old text format [选项]
  if (!options) {
  var optIdx = text.indexOf('[选项]');
  if (optIdx >= 0) {
    var afterOpt = text.substring(optIdx);
    // Parse tag string to risk — handles single and combined tags
    var tagRiskMap = { '安全': 'safe', '危险': 'danger', '机遇': 'risky', '色情': 'erotic', '死亡': 'death' };
    function parseTagStr(tagStr) {
      if (!tagStr) return { risk: 'neutral', risks: [] };
      var parts = tagStr.split('+').map(function(p){ return tagRiskMap[p.trim()] || 'neutral'; });
      var primary = parts.find(function(p){ return p !== 'neutral'; }) || 'neutral';
      return { risk: primary, risks: parts };
    }
    // New format: each option can have [tag+tag] combined tags
    var taggedMatch = afterOpt.match(/\[选项\]\s*\n?\s*1\.\s*(?:\[([^\]]+)\]|【([^\]]+)】)?\s*(.+?)\s*\n\s*2\.\s*(?:\[([^\]]+)\]|【([^\]]+)】)?\s*(.+?)\s*\n\s*3\.\s*(?:\[([^\]]+)\]|【([^\]]+)】)?\s*(.+?)\s*$/m);
    if (taggedMatch) {
      function getTag(cap1, cap2) { return (cap1 || cap2 || '') ; }
      var p1 = parseTagStr(getTag(taggedMatch[1], taggedMatch[2]));
      var p2 = parseTagStr(getTag(taggedMatch[3], taggedMatch[4]));
      var p3 = parseTagStr(getTag(taggedMatch[5], taggedMatch[6]));
      options = [
        { text: (taggedMatch[7] || '').trim(), risk: p1.risk, risks: p1.risks },
        { text: (taggedMatch[8] || '').trim(), risk: p2.risk, risks: p2.risks },
        { text: (taggedMatch[9] || '').trim(), risk: p3.risk, risks: p3.risks }
      ];
    } else {
      // Fallback: old format without tags
      var oldMatch = afterOpt.match(/\[选项\]\s*\n?\s*1[\.、]\s*(.+?)\s*\n?\s*2[\.、]\s*(.+?)\s*\n?\s*3[\.、]\s*(.+?)\s*$/m);
      if (oldMatch) {
        options = [
          { text: (oldMatch[1] || '').trim(), risk: 'neutral' },
          { text: (oldMatch[2] || '').trim(), risk: 'neutral' },
          { text: (oldMatch[3] || '').trim(), risk: 'neutral' }
        ];
      } else {
        // Very loose match
        var loose = afterOpt.match(/\n\s*1[\.、\)]\s*(.+?)[\n\r]/);
        var loose2 = afterOpt.match(/\n\s*2[\.、\)]\s*(.+?)[\n\r]/);
        var loose3 = afterOpt.match(/\n\s*3[\.、\)]\s*(.+?)[\n\r]/);
        if (loose && loose2 && loose3) {
          options = [
            { text: (loose[1] || '').trim(), risk: 'neutral' },
            { text: (loose2[1] || '').trim(), risk: 'neutral' },
            { text: (loose3[1] || '').trim(), risk: 'neutral' }
          ];
        }
      }
    }
    // Remove options section from display text
    text = text.substring(0, optIdx).trim();
  }
  } // end if (!options)

  var lines = text.split('\n').filter(function (l) { return l.trim(); });
  if (lines.length === 0) {
    addChatNarrate(w, '（沉默）');
    if (options) setLastMessageOptions(w, options);
    return;
  }
  var hasDeath = false;
  var hasEnd = false;
  var isBadEnd = false;
  try {
  lines.forEach(function (l) {
    if (/\[DEATH\]/i.test(l)) {
      hasDeath = true;
      return;
    }
    if (/\[FIN\]/i.test(l) || /\[结局\]/.test(l)) {
      hasEnd = true;
      isBadEnd = /BAD/i.test(l) || /坏/.test(l);
      return;
    }
    // Strip [叙述] prefix unconditionally
    var stripped = l.replace(/^\[叙述\]\s*/, '');
    var isNarrate = (stripped !== l);
    var narrText = stripped;
    var speechMatch = l.match(/^\[(.+?)\](?:[：:]\s*|说[：:]\s*)(.+)/);
    if (!speechMatch && !isNarrate) {
      var colonMatch = l.match(/^([^：:\[\]]+)[：:]\s*(.+)/);
      if (colonMatch) {
        var activeWorld = getActiveWorld();
        var charNames = activeWorld ? (activeWorld.characters || []).map(function(c){ return c.name; }) : [];
        var protName = activeWorld && activeWorld.protagonist ? activeWorld.protagonist.name : '';
        var cName = (colonMatch[1] || '').trim();
        if (charNames.indexOf(cName) >= 0 || cName === protName) {
          speechMatch = [null, cName, (colonMatch[2] || '').trim()];
        }
      }
    }
    if (isNarrate && narrText.trim()) {
      addChatNarrate(w, narrText.trim());
    } else if (speechMatch) {
      addChatSpeech(w, speechMatch[1], speechMatch[2], false);
    } else if (l.trim()) {
      // Fallback: strip [叙述] just in case regex missed it
      var fb = l.trim().replace(/^\[叙述\]\s*/, '');
      if (fb) addChatNarrate(w, fb);
    }
  });
  } catch(e) { console.error('parseAIResponse line loop error:', e.message, e.stack); }

  // Attach options to last message if present
  try { if (options) setLastMessageOptions(w, options); } catch(e) { console.error('setLastMessageOptions error:', e.message, e.stack); }

  // Track erotic options for achievements
  if (options) {
    var hasErotic = options.some(function(o){ return o.risk==='erotic'||(o.risks&&o.risks.indexOf('erotic')>=0); });
    if (hasErotic) {
      ensureWorldStats(w);
      w.stats.eroticScenes = (w.stats.eroticScenes||0) + 1;
    }
  }

  if (hasDeath) handleDeath(w);
  if (hasEnd) handleWorldEnd(w, isBadEnd);
}

function handleDeath(w) {
  // Check talents for death prevention
  var hasSave = w.protagonist.talents.some(function(t){
    return t.id==='b1'||t.id==='b4'||t.id==='p1';
  });
  if (hasSave) {
    addChatSystem(w, '✖ 致命事件触发！检测到天赋保护——「死里逃生」/「绝处逢生」/「不死祝福」已激活。');
    addChatNarrate(w, '一道温暖的光笼罩了你。在命运的最后关头，你身上的天赋之力强行扭转了必死的结局。时间倒流——');
    // Track death cheated for achievements
    ensureWorldStats(w);
    w.stats.deathCheated = true;
    checkAchievements(w);
    rewindToCheckpoint(w);
    return;
  }
  if (w.difficulty === 'hell') {
    addChatSystem(w, '✖ 地狱难度——主角死亡，世界即将删除。');
    addChatNarrate(w, '一切归于虚无。你的故事到此结束。');
    setTimeout(function(){
      if (confirm('✖ 地狱难度：主角已死亡。该世界将被删除。\n\n确定删除？')) {
        deleteWorld(w.id);
      }
    }, 500);
    return;
  }
  showRewindOptions(w);
}

function showRewindOptions(w) {
  var cps = w.checkpoints || [];
  var opts = [];
  // Auto-checkpoint every 5 messages
  if (cps.length === 0) {
    // Create an emergency checkpoint from last safe point
    var hid = w.id;
    var log = state.chatHistory[hid] || [];
    saveCheckpoint(w, Math.max(0, log.length - 5), '自动存档');
    cps = w.checkpoints;
  }
  opts = cps.map(function(c,i){return (i+1)+'. '+c.label+' ('+new Date(c.time).toLocaleTimeString()+')';});
  showQuickPrompt('选择回档点：\n\n'+opts.join('\n')+'\n\n输入序号回档', '', function(choice) {
    if (!choice) { addChatSystem(w, '你选择了接受命运。故事终结。'); return; }
    var idx = parseInt(choice)-1;
    if (idx<0||idx>=cps.length) { addChatSystem(w, '无效选择。'); return; }
    rewindToCheckpoint(w, idx);
  });
}

function saveCheckpoint(w, index, label) {
  if (!w.checkpoints) w.checkpoints = [];
  w.checkpoints.push({index:index, label:label||'存档点', time:Date.now()});
  if (w.checkpoints.length > 10) w.checkpoints.shift();
  saveState();
  renderCheckpointBar(w);
}

function rewindToCheckpoint(w, idx) {
  var cps = w.checkpoints;
  if (!cps||cps.length===0) return;
  if (idx===undefined) idx = cps.length-1;
  var cp = cps[idx];
  var hid = w.id;
  state.chatHistory[hid] = (state.chatHistory[hid]||[]).slice(0, cp.index);
  addChatSystem(w, '‣ 已回档到：' + cp.label);
  saveState();
  renderChatLog();
  renderSidePanel();
}

// ===== WORLD END / CLEAR RATING =====
function handleWorldEnd(w, isBadEnd) {
  if (!w) return;
  ensureWorldStats(w);
  w.stats.cleared = !isBadEnd;
  if (isBadEnd) w.stats.badEnd = true;
  // Count deaths from chat history
  var hid = w.id;
  var log = state.chatHistory[hid] || [];
  var deathCount = log.filter(function(m){ return m.type==='system' && /DEATH/.test(m.text); }).length;
  // Calculate rating
  var grade = calcClearGrade(w, deathCount, isBadEnd);
  var seeds = gradeReward(grade);
  // Update meta
  var meta = state.metaProgression;
  meta.seeds = (meta.seeds||0) + seeds;
  meta.totalClears = (meta.totalClears||0) + (isBadEnd ? 0 : 1);
  if (!meta.highestGrade || gradeRank(grade) < gradeRank(meta.highestGrade)) meta.highestGrade = grade;
  meta.stats.totalDeaths = (meta.stats.totalDeaths||0) + deathCount;
  // NSFW world clear: randomly unlock one NSFW talent
  if (w.allowNSFW && !isBadEnd) {
    var lockedNSFW = talentPool.filter(function(t){ return t.nsfw && t.unlock && state.unlockedTalents.indexOf(t.id)<0; });
    if (lockedNSFW.length > 0) {
      var pick = lockedNSFW[Math.floor(Math.random()*lockedNSFW.length)];
      state.unlockedTalents.push(pick.id);
      toast('⊘ NSFW世界通关奖励：解锁天赋「' + pick.name + '」', 'success');
    }
  }
  saveState();
  // Show results
  showClearRating(w, grade, seeds, deathCount, isBadEnd);
  renderAchievementPanel();
  checkAchievements(w);
  checkTalentQuests(w);
}
// ===== TALENT QUEST SYSTEM =====
function checkTalentQuests(w) {
  var meta = state.metaProgression;
  if (!meta || !w) return;
  if (meta._questCheckDone && meta._questCheckDone === w.id) return;
  meta._questCheckDone = w.id;
  var st = meta.stats;
  st.totalRounds = (st.totalRounds||0) + ((state.chatHistory[w.id]||[]).length||0);
  st.worldsPlayed = (st.worldsPlayed||0) + 1;
  if (w.difficulty === 'hell') st.hellRounds = (st.hellRounds||0) + ((state.chatHistory[w.id]||[]).length||0);
  if (w.allowNSFW && !(w.stats&&w.stats.badEnd)) st.nsfwWorlds = (st.nsfwWorlds||0) + 1;
  var unlocked = state.unlockedTalents || [];
  var newlyUnlocked = [];
  talentPool.forEach(function(t) {
    if (!t.unlock || !t.quest || unlocked.indexOf(t.id) >= 0) return;
    var q = t.quest, val = 0;
    switch (q.type) {
      case 'clear':   val = meta.totalClears||0; break;
      case 'badEnd':  val = state.worlds.filter(function(x){ return x.stats&&x.stats.badEnd; }).length; break;
      case 'deaths':  val = st.totalDeaths||0; break;
      case 'seeds':   val = meta.seeds||0; break;
      case 'rounds':  val = st.totalRounds||0; break;
      case 'worlds':  val = st.worldsPlayed||0; break;
      case 'hell':    val = st.hellRounds||0; break;
      case 'nsfw':    val = st.nsfwWorlds||0; break;
    }
    if (val >= q.target) { unlocked.push(t.id); newlyUnlocked.push(t); }
  });
  if (newlyUnlocked.length > 0) {
    state.unlockedTalents = unlocked;
    saveState();
    var names = newlyUnlocked.map(function(t){ return t.name; }).join('、');
    toast('⧐ 任务完成！解锁天赋：' + names, 'success');
  }
}
function getQuestProgress(talent) {
  if (!talent.quest) return {done:false,val:0,target:0};
  var meta = state.metaProgression, st = meta.stats, q = talent.quest, val = 0;
  switch (q.type) {
    case 'clear':  val = meta.totalClears||0; break;
    case 'badEnd': val = state.worlds.filter(function(x){return x.stats&&x.stats.badEnd;}).length; break;
    case 'deaths': val = st.totalDeaths||0; break;
    case 'seeds':  val = meta.seeds||0; break;
    case 'rounds': val = st.totalRounds||0; break;
    case 'worlds': val = st.worldsPlayed||0; break;
    case 'hell':   val = st.hellRounds||0; break;
    case 'nsfw':   val = st.nsfwWorlds||0; break;
  }
  return {done:val>=q.target, val:val, target:q.target};
}
function calcClearGrade(w, deathCount, isBadEnd) {
  if (isBadEnd) return 'C';
  if (w.difficulty==='hell' && deathCount===0) return 'S';
  if (w.difficulty==='hell') return 'A';
  if (w.difficulty==='hard') return 'A';
  if (w.difficulty==='normal') return 'B';
  return 'C';
}
function gradeRank(g) { return {S:0,A:1,B:2,C:3}[g]||4; }
function gradeReward(g) { return {S:15,A:10,B:5,C:2}[g]||0; }
function showClearRating(w, grade, seeds, deathCount, isBadEnd) {
  var gradeColors = {S:'#ffd700',A:'#ff6b6b',B:'#4ecdc4',C:'#95a5a6'};
  var gradeNames = {S:'完美通关',A:'优秀通关',B:'标准通关',C:'旅程结束'};
  var html = '<div style="text-align:center;padding:16px 12px">'
    + '<div style="font-size:40px;color:'+(gradeColors[grade]||'#aaa')+';text-shadow:0 0 20px '+(gradeColors[grade]||'#aaa')+'40">' + grade + '</div>'
    + '<div style="font-size:14px;color:'+(gradeColors[grade]||'#aaa')+';font-weight:700;margin:4px 0">' + (gradeNames[grade]||'') + '</div>'
    + '<div style="font-size:11px;color:var(--text-dim);margin:8px 0">'
    + '难度：' + w.difficulty + ' · 死亡：' + deathCount + '次 · ' + (isBadEnd?'坏结局':'通关')
    + '</div>'
    + '<div style="font-size:13px;color:var(--accent);margin:8px 0">+<b>' + seeds + '</b> 命运之种</div>'
    + '<div style="font-size:10px;color:var(--text-dim)">累计命运之种：<b>' + (state.metaProgression.seeds||0) + '</b></div>'
    + '<button style="margin-top:10px;padding:6px 20px;font-size:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);border-radius:6px;cursor:pointer" onclick="document.getElementById(\'clearRatingOverlay\').remove()">继续</button>'
    + '</div>';
  var overlay = document.createElement('div');
  overlay.id = 'clearRatingOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';
  overlay.innerHTML = '<div style="background:rgba(20,16,12,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:16px;max-width:340px;width:90%;box-shadow:0 0 40px rgba(0,0,0,0.5)">' + html + '</div>';
  document.body.appendChild(overlay);
  // Also add a system message
  addChatSystem(w, '◉ 评级：' + grade + '（' + (gradeNames[grade]||'') + '） +' + seeds + '命运之种');
  renderChatLog();
}

function rewindFromTopBar() {
  var w = getActiveWorld();
  if (!w) { toast('请先选择一个世界', 'error'); return; }
  // Priority: manual saves > auto save > checkpoints
  if (w.saves && w.saves.manualList && w.saves.manualList.length > 0) {
    showLoadSaveModal(w);
    return;
  }
  // Fallback: use auto save
  if (w.saves && w.saves.auto && w.saves.auto.snapshot) {
    var hid = w.id;
    addChatSystem(w, '‣ 已回档到：自动存档');
    state.chatHistory[hid] = JSON.parse(JSON.stringify(w.saves.auto.snapshot.chatHistory || []));
    w.protagonist = JSON.parse(JSON.stringify(w.saves.auto.snapshot.protagonist || w.protagonist));
    saveState();
    renderChatLog();
    renderSidePanel();
    toast('已从自动存档恢复', 'success');
    return;
  }
  // Fallback: use checkpoints
  if (w.checkpoints && w.checkpoints.length > 0) {
    rewindToCheckpoint(w, w.checkpoints.length - 1);
    return;
  }
  toast('暂无存档，请先手动存档', 'info');
}

function renderCheckpointBar(w) {
  var el = document.getElementById('checkpointBar');
  if (!el) return;
  el.style.display = 'none';
}

// ===== RENDER OPTION CARDS =====
function renderOptionCards(options) {
  var wrap = document.getElementById('optionCardsWrap');
  var cards = document.getElementById('optionCards');
  if (!wrap || !cards) return;
  if (!options || options.length === 0) {
    wrap.style.display = 'none';
    return;
  }
  var w = getActiveWorld();
  wrap.style.display = 'block';
  // Check if player has the risk perception talent
  var hasRiskSense = false;
  if (w.protagonist && w.protagonist.talents) {
    hasRiskSense = w.protagonist.talents.some(function(t){ return t.id === 'k6'; });
  }
  var riskIcons = { safe: '◎', danger: '‡', risky: '⧐', neutral: '➢', erotic: '♥', death: '☠' };
  var riskLabels = { safe: '安全路线 · 稳扎稳打', danger: '危险路线 · 高风险', risky: '机遇路线 · 祸福相依', neutral: '行动路线', erotic: '色情路线 · 欲望交织', death: '死亡路线 · 九死一生' };
  // Combined type labels — use both constituent labels
  var combinedLabels = {
    'danger-risky': '危险+机遇 · 虎口夺食',
    'safe-risky': '安全+机遇 · 稳中求变',
    'erotic-risky': '色情+机遇 · 欲望与机遇',
    'erotic-danger': '色情+危险 · 致命诱惑',
    'safe-danger': '安全+危险 · 进退之间'
  };
  cards.innerHTML = options.map(function(o, i){
    var risk = o.risk || 'neutral';
    var text = typeof o === 'string' ? o : o.text;
    // Build CSS class — for combined types join with dash
    var cssClass = 'neutral';
    if (o.risks && o.risks.length >= 2) {
      cssClass = o.risks.join('-');
    } else if (risk !== 'neutral') {
      cssClass = risk;
    }
    // Without talent: all neutral (except erotic/death which always show)
    var alwaysShow = (risk === 'erotic' || risk === 'death' || cssClass.indexOf('erotic') >= 0 || cssClass.indexOf('death') >= 0);
    var displayClass = hasRiskSense ? cssClass : (alwaysShow ? cssClass : 'neutral');
    var showLabel = hasRiskSense || alwaysShow;
    // Icon: for combined, show first constituent's icon
    var icon = hasRiskSense ? (riskIcons[risk] || '➢') : (alwaysShow ? (riskIcons[risk] || '➢') : '➢');
    // Label: for combined, use combined label map
    var label = combinedLabels[cssClass] || riskLabels[risk] || '';
    return '<div class="option-card ' + displayClass + '" onclick="pickOptionCard(this, ' + i + ', \'' + esc(text) + '\')">'
      + '<div class="opt-num">' + icon + ' 选项 ' + (i+1) + '</div>'
      + '<div class="opt-text">' + esc(text) + '</div>'
      + (showLabel ? '<div class="opt-hint">' + label + '</div>' : '')
      + '</div>';
  }).join('');
  // Free input option below the 3 cards
  cards.innerHTML += '<div class="option-card free-input" onclick="focusChatInput()" style="grid-column:1/-1;margin-top:4px">'
  + '<div class="opt-text">• 不想选？自己输入想做的事…</div>'
  + '</div>';
}
function pickOptionCard(el, idx, text) {
  var allCards = document.querySelectorAll('.option-card:not(.free-input)');
  allCards.forEach(function(c){ c.style.opacity = '0.5'; });
  el.style.opacity = '1';
  el.style.transform = 'scale(1.02)';
  var inp = document.getElementById('chatInput');
  if (inp) { inp.value = text; inp.focus(); }
  // Auto-hide after selection
  setTimeout(function(){
    var wrap = document.getElementById('optionCardsWrap');
    if (wrap) wrap.style.display = 'none';
  }, 300);
}
function focusChatInput() {
  var wrap = document.getElementById('optionCardsWrap');
  if (wrap) wrap.style.display = 'none';
  var inp = document.getElementById('chatInput');
  if (inp) { inp.value = ''; inp.focus(); }
}
function quickAction(text) {
  var inp = document.getElementById('chatInput');
  if (!inp || inp.disabled) return;
  inp.value = text;
  inp.focus();
  // Auto-send after brief delay so user sees what's being sent

}

// Difficulty thresholds: [厄运上限, 不顺上限, 平常上限, 好运上限]
var diceDifficulty = {
  easy:   { bad:2, minor:7, norm:14, good:18, streakToDie: 5, deathOnNat1: false },
  normal: { bad:4, minor:9, norm:14, good:18, streakToDie: 3, deathOnNat1: false },
  hard:   { bad:5, minor:10, norm:14, good:17, streakToDie: 2, deathOnNat1: false },
  hell:   { bad:8, minor:12, norm:14, good:16, streakToDie: 2, deathOnNat1: false }
};

function getDiceThresholds(w) {
  return diceDifficulty[w.difficulty] || diceDifficulty.normal;
}

function diceRollAction() {
  var w = getActiveWorld();
  if (!w || w.mode !== 'dice') return;
  if (!state.apiKey) { toast('请先配置API Key', 'error'); showPanel('settings'); return; }
  var btn = document.getElementById('diceRollBtn');
  if (btn) { btn.style.pointerEvents = 'none'; btn.style.opacity = '0.5'; }
  var thresh = getDiceThresholds(w);
  // Check for active dice talent modifiers
  var modifier = 0;
  if (w._diceMods && w._diceMods.length > 0) {
    var mod = w._diceMods.shift();
    modifier = mod.bonus || 0;
    if (mod.label) toast('🎲 天赋生效：「'+mod.label+'」', 'info');
  }
  var roll = 1 + Math.floor(Math.random() * 20) + modifier;
  roll = Math.max(1, Math.min(20, roll));
  var fateText, fateColor;
  if (roll <= thresh.bad)       { fateText = '厄运'; fateColor = '#e44'; }
  else if (roll <= thresh.minor) { fateText = '不顺'; fateColor = '#e84'; }
  else if (roll <= thresh.norm)  { fateText = '平常'; fateColor = '#aaa'; }
  else if (roll <= thresh.good)  { fateText = '好运'; fateColor = '#4a8'; }
  else                           { fateText = '大吉'; fateColor = '#ffd700'; }
  // Track bad streak for death risk
  if (roll <= thresh.bad) {
    if (!w._badStreak) w._badStreak = 0;
    w._badStreak++;
  } else {
    w._badStreak = 0;
  }
  // Death check
  var deathRisk = (thresh.deathOnNat1 && roll === 1) || (w._badStreak >= thresh.streakToDie);
  // Show result
  var res = document.getElementById('diceResult');
  var num = document.getElementById('diceNumber');
  var fate = document.getElementById('diceFateText');
  if (res && num && fate) {
    num.textContent = roll; num.style.color = fateColor;
    fate.textContent = deathRisk ? '💀 '+fateText : fateText; fate.style.color = fateColor;
    res.style.display = '';
    setTimeout(function(){ if (res) res.style.display = 'none'; }, 4000);
  }
  if (!w._diceHistory) w._diceHistory = [];
  w._diceHistory.push({ roll: roll, fate: fateText, time: Date.now(), deathRisk: deathRisk });
  updateDiceRollCount(); renderDiceHistory();
  // Build message
  var log = state.chatHistory[w.id] || [];
  var recentLog = log.slice(-10).map(function(m){
    if (m.type==='narrate') return '[叙述] '+m.text;
    if (m.type==='system') return '';
    return '['+(m.speaker||'')+']: '+m.text;
  }).filter(Boolean).join('\n');
  var userMsg = '【掷骰结果：d20=' + roll + (modifier?('（含修正+' + modifier + '）'):'') + '（' + fateText + '）' + (deathRisk ? ' ⚠️致命危险！' : '') + (w._badStreak > 0 ? ' 连厄×'+w._badStreak : '') + '】\n';
  if (deathRisk) {
    userMsg += '⚠️ 致命事件触发！主角面临生死危机。请叙述一场危及生命的危险事件——可以是重伤、被敌人擒获、绝境坠落等。主角可能死亡或濒死，但仍保留一线生机（取决于是否有天赋保护）。';
  } else {
    userMsg += (roll <= thresh.bad ? '厄运——发生一件坏事、意外或挫折。主角受挫但不致命。' : roll <= thresh.minor ? '不顺——进度受阻但不算致命。' : roll <= thresh.norm ? '平常——正常推进剧情，可能有小发现。' : roll <= thresh.good ? '好运——发生一件对主角有利的事。' : '大吉——重大突破、关键发现或转机！');
  }
  addChatSpeech(w, '🎲 掷骰', userMsg, true);
  addTypingIndicator(w);
  fetch(state.apiUrl,{
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey},
    body:JSON.stringify({ model: state.apiModel,
      messages: [{role:'system', content: buildDiceSystemPrompt(w)}, {role:'user', content: buildDiceUserContext(w, recentLog, userMsg)}],
      temperature: 0.85, max_tokens: 2500 })
  })
  .then(function(r){if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
  .then(function(d){
    var reply = (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
    removeTypingIndicator(w); parseAIResponse(w, reply);
    // After AI response, check if death happened
    if (deathRisk && reply.indexOf('[FIN BAD]') >= 0) {
      handleDiceDeath(w);
    }
    if (btn) { btn.style.pointerEvents = ''; btn.style.opacity = ''; }
  })
  .catch(function(e){
    removeTypingIndicator(w); addChatSystem(w, '掷骰失败: '+e.message);
    if (btn) { btn.style.pointerEvents = ''; btn.style.opacity = ''; }
  });
}

function handleDiceDeath(w) {
  // Check for death-protecting talents first
  var hasProt = w.protagonist.talents.some(function(t){ return t.id==='b1'||t.id==='b4'||t.id==='p1'||t.id==='d4'; });
  if (hasProt) {
    addChatSystem(w, '💀 致命事件触发！检测到天赋保护——「死里逃生」/「绝处逢生」/「不死祝福」/「命运眷顾」已激活。主角在绝境中活了下来。');
    w._badStreak = 0;
    return;
  }
  addChatSystem(w, '💀 主角遭遇了致命打击——冒险到此结束。你可以回档至最近的存档点。');
  showCheckpoints(w);
}

function buildDiceSystemPrompt(w) {
  var styleStr = w.styleTags.join('、')||'自然流畅';
  var thresh = getDiceThresholds(w);
  var diffStr = ({easy:'简单',normal:'普通',hard:'困难',hell:'地狱'})[w.difficulty]||'普通';
  var s = '你是TRPG骰子游戏的叙事GM。难度：'+diffStr+'。世界：'+w.name+'。背景：'+(w.background||'')+'。文风：'+styleStr+'。';
  if (w.powerLevel) s += buildPowerLevelRule(w.powerLevel, false);
  if (w.customStyle) s += ' 额外风格要求：'+w.customStyle+'。';
  if (w._customRule) s += '【创世规则——必须严格遵守】'+w._customRule+'。';
  s += '【骰子规则】玩家通过d20推进剧情。当前难度下掷骰判定：1-'+thresh.bad+'厄运、'+(thresh.bad+1)+'-'+thresh.minor+'不顺、'+(thresh.minor+1)+'-'+thresh.norm+'平常、'+(thresh.norm+1)+'-'+thresh.good+'好运、'+(thresh.good+1)+'-20大吉。连厄×'+thresh.streakToDie+'触发致命事件。必须严格按结果控制走向。收到⚠️致命事件时，写一场危及生命的危险场景——重伤、被擒、坠崖等。主角可能死亡（标记[FIN BAD]），也可能侥幸存活但付出惨重代价。每次回复末尾必须输出[选项]区块，给出3个下一步的掷骰行动方向（如「深入探索[厄运阈值]」「尝试交涉[平常阈值]」「绕路前进[好运阈值]」），只写行动方向文字，绝不要使用[安全][危险][机遇]等倾向标签。字数2000字左右。';
  s += '【写作铁则】'+(w.writingRules||defaultWritingRules);
  return s;
}

function buildDiceUserContext(w, recentLog, userMsg) {
  var charsContext = w.characters.map(function(c){return c.name+'('+(c.tag||'')+'/'+(c.relationship||'')+'): '+(c.desc||c.background||'');}).join('; ');
  return '主角：'+w.protagonist.name+'（'+w.protagonist.gender+'，'+w.protagonist.age+'岁）。'+(w.protagonist.background?'背景：'+w.protagonist.background+'。':'')+'技能：'+(w.protagonist.skill||'无')+'。天赋：'+(w.protagonist.talents.map(function(t){return t.name;}).join('、')||'无')+'。\n配角：'+charsContext+'\n\n【最近剧情】\n'+recentLog+'\n\n'+userMsg;
}

function renderDiceTalents() {

  el.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:6px;border-top:0.5px solid rgba(255,255,255,0.05)">'

      var uses = t._uses !== undefined ? t._uses : (t.uses || 0);
      var used = (t.maxUses && uses <= 0);
      var disabled = cd > 0 || used;
      var label = t.name + (disabled ? (cd > 0 ? ' ('+cd+')' : ' 已用尽') : '');
      return '<button class="btn btn-xs" onclick="useDiceTalent(\''+t.id+'\')" '+(disabled?'disabled style="opacity:0.3"':'')+' style="padding:2px 8px;font-size:10px;border-color:rgba(196,149,106,0.2);color:var(--accent)">'+label+'</button>';
    }).join('')

function useDiceTalent(talentId) {
  var w = getActiveWorld(); if (!w || w.mode !== 'dice') return;
  var t = w.protagonist.talents.find(function(x){ return x.id === talentId; });
  if (!t || !t.dice) return;
  // Check cooldown
  if (w.protagonist.talentCooldowns && w.protagonist.talentCooldowns[t.id] > 0) {
    toast('冷却中（剩余'+w.protagonist.talentCooldowns[t.id]+'轮）', 'error'); return;
  }
  // Check uses
  if (t._uses === undefined) t._uses = t.uses || 0;
  if (t.maxUses && t._uses <= 0) { toast('已用尽', 'error'); return; }
  // Execute
  switch (t.dice) {
    case 'reroll':
      // Reroll last: undo last roll and re-roll
      if (!w._diceHistory || w._diceHistory.length === 0) { toast('没有可重掷的记录', 'error'); return; }
      if (t._uses !== undefined && t.maxUses) t._uses--;
      var lastRoll = w._diceHistory[w._diceHistory.length - 1];
      var newRoll = 1 + Math.floor(Math.random() * 20);
      lastRoll.roll = Math.max(lastRoll.roll, newRoll);
      lastRoll.fate = lastRoll.roll <= 4 ? '厄运' : lastRoll.roll <= 9 ? '不顺' : lastRoll.roll <= 14 ? '平常' : lastRoll.roll <= 18 ? '好运' : '大吉';
      updateDiceRollCount(); renderDiceHistory(); renderDiceTalents();
      toast('🎲 重掷！新结果：d'+lastRoll.roll+' '+lastRoll.fate, 'success');
      // Resend with new roll
      diceRerollSend(w);
      break;
    case 'bonus':
      if (!w._diceMods) w._diceMods = [];
      w._diceMods.push({ bonus: t.bonus || 3, label: t.name });
      if (t._uses !== undefined && t.maxUses) t._uses--;
      renderDiceTalents();
      toast('🎲 「'+t.name+'」已激活，下次掷骰+'+t.bonus, 'success');
      break;
    case 'deathImmune':
      w._badStreak = 0;
      if (t._uses !== undefined && t.maxUses) t._uses--;
      renderDiceTalents();
      toast('🛡️ 命运眷顾！连厄计数已清零，致命免疫生效', 'success');
      break;
    case 'lucky':
      if (!w._diceMods) w._diceMods = [];
      w._diceMods.push({ bonus: 15, label: t.name }); // Guarantee 15+ by adding large bonus
      if (t._uses !== undefined && t.maxUses) t._uses--;
      renderDiceTalents();
      toast('⭐ 幸运骰！下次掷骰必定15+', 'success');
      break;
    case 'clearStreak':
      w._badStreak = 0;
      if (!w.protagonist.talentCooldowns) w.protagonist.talentCooldowns = {};
      w.protagonist.talentCooldowns[t.id] = (t.cooldown || 5);
      renderDiceTalents();
      toast('🔮 厄运抵抗！连厄计数已清零', 'success');
      break;
    case 'preview':
      // Show 3 possible outcomes
      var previews = [1+Math.floor(Math.random()*20), 1+Math.floor(Math.random()*20), 1+Math.floor(Math.random()*20)];
      var texts = previews.map(function(r){ return 'd'+r+' '+ (r<=4?'厄运':r<=9?'不顺':r<=14?'平常':r<=18?'好运':'大吉'); }).join(' / ');
      toast('🔮 预见骰子：'+texts, 'info');
      break;
  }
  saveState();
}

function diceRerollSend(w) {
  // Resend the last user message context to AI
  var log = state.chatHistory[w.id] || [];
  // Remove last AI reply
  for (var i = log.length - 1; i >= 0; i--) {
    if (log[i].type === 'narrate' || (log[i].type === 'speech' && !log[i].isUser)) {
      log.splice(i, 1); break;
    }
  }
  var recentLog = log.slice(-10).map(function(m){
    if (m.type==='narrate') return '[叙述] '+m.text;
    if (m.type==='system') return '';
    return '['+(m.speaker||'')+']: '+m.text;
  }).filter(Boolean).join('\n');
  var last = w._diceHistory[w._diceHistory.length - 1];
  var userMsg = '【重掷骰子结果：d20='+last.roll+'（'+last.fate+'）】根据新结果重新叙述。';
  addChatSpeech(w, '🎲 重掷', userMsg, true);
  addTypingIndicator(w);
  fetch(state.apiUrl,{
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey},
    body:JSON.stringify({ model: state.apiModel,
      messages: [{role:'system', content: buildDiceSystemPrompt(w)}, {role:'user', content: buildDiceUserContext(w, recentLog, userMsg)}],
      temperature: 0.85, max_tokens: 2500 })
  })
  .then(function(r){if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
  .then(function(d){
    var reply = (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'';
    removeTypingIndicator(w); parseAIResponse(w, reply);
  })
  .catch(function(e){ removeTypingIndicator(w); addChatSystem(w, '重掷失败: '+e.message); });
}

function useActiveTalent(talentId) {
  var w = getActiveWorld();
  if (!w) return;
  var talent = talentPool.find(function(t) { return t.id === talentId; });
  if (!talent) return;

  var prompts = {
    'a1': '使用天赋「内心探查」，你想探查谁：',
    'a2': '使用天赋「危险预演」：',
    'a3': '使用天赋「魅惑之触」，目标：',
    'a5': '使用天赋「危机直觉」：'
  };

  // Special handling for g1: 破局直觉 — auto-generate a clue
  if (talentId === 'g1') {
    addChatSystem(w, '◉ 使用了天赋「破局直觉」…');
    startCooldown(talentId);
    var recentLog = (state.chatHistory[w.id]||[]).slice(-6).map(function(m){
      if (m.type==='narrate') return '[叙述] '+m.text;
      if (m.type==='speech') return '['+m.speaker+']: '+m.text;
      return '';
    }).filter(Boolean).join('\n');
    callAI('你是当前故事的GM。主角使用了天赋「破局直觉」，需要你分析当前局面并给出一个关键线索或破局方向。\n\n【最近剧情】\n'+recentLog+'\n\n请以[叙述]格式，用一段话（约100字）给出直觉线索。线索应该是具体的、可行动的，但不能直接告诉答案——用暗示、征兆、细节来引导。末尾必须带[选项]三个跟线索相关的行动选项。用中文。', function(text){
      parseAIResponse(w, text);
    });
    return;
  }

  // Special handling for a4: 时间回溯 — rewind last AI response + refresh options
  if (talentId === 'a4') {
    var log = state.chatHistory[w.id] || [];
    var lastUserIdx = -1, lastUserText = '', lastUserSpeaker = '你';
    for (var i = log.length - 1; i >= 0; i--) {
      if (log[i].isUser) { lastUserIdx = i; lastUserText = log[i].text; lastUserSpeaker = log[i].speaker; break; }
    }
    if (lastUserIdx < 0) { toast('没有可回退的对话', 'error'); return; }
    // Strip from last user onward
    log.splice(lastUserIdx);
    // Re-add user message
    addChatSpeech(w, lastUserSpeaker, lastUserText, true);
    addChatSystem(w, '⏪ 时间回溯——倒流至上一轮对话，命运重新编织…');
    startCooldown(talentId);
    renderChatLog();
    // Re-send to AI for fresh response + options
    var log2 = state.chatHistory[w.id] || [];
    var recentLog = log2.slice(-12).map(function(m){
      if (m.type==='narrate') return '[叙述] '+m.text;
      if (m.type==='system') return '';
      return '['+m.speaker+']: '+m.text;
    }).filter(Boolean).join('\n');
    var charsContext = w.characters.map(function(c){return c.name+'('+(c.tag||'')+'): '+(c.desc||'');}).join('; ');
    var styleStr = w.styleTags.join('、')||'自然流畅';
    var systemPrompt = '你是一个小说世界的互动叙事引擎。当前世界：'+w.name+'。背景：'+(w.background||'')+'。规则：'+(w.rules||'')+'。文风：'+styleStr+'。';
    if (w.powerLevel) systemPrompt += buildPowerLevelRule(w.powerLevel, false);
    if (w.customStyle) systemPrompt += ' 额外风格要求：'+w.customStyle+'。';
    if (w._customRule) systemPrompt += '【创世规则——必须严格遵守】'+w._customRule+'。';
    systemPrompt += ' 【写作铁则】'+(w.writingRules||defaultWritingRules);
    systemPrompt += ' 角色列表：主角('+w.protagonist.name+')——性别'+w.protagonist.gender+'年龄'+w.protagonist.age+'。'+(w.protagonist.background?'背景：'+w.protagonist.background+'。':'')+'天赋：'+w.protagonist.talents.map(function(t){return t.name+'('+t.rarity+'级)';}).join('、')+'。配角：'+charsContext+'。';
    if (w.protagonist.skill) systemPrompt += ' 主角一技之长：'+w.protagonist.skill+'。';
    systemPrompt += ' 每次回复末尾，请用"[选项]"标记提供3个简短的行动选项供玩家选择。选项应有不同风格/风险/方向。每个选项不超过15个字。格式严格为：[选项]\n1. 选项一\n2. 选项二\n3. 选项三';
    var wordLimit = w.wordLimit || 1500;
    systemPrompt += ' 本次回复字数控制在约'+wordLimit+'字左右。';
    fetch(state.apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey},body:JSON.stringify({model:state.apiModel,messages:[{role:'system',content:systemPrompt},{role:'user',content:lastUserText}],temperature:0.8,max_tokens:2000})})
    .then(function(r){if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
    .then(function(d){

}

  Object.keys(w.protagonist.talentCooldowns).forEach(function(id) {

// ===== SCENE ACCORDION BUILDER =====
function buildSceneAccordion(text) {
  if (!text || text === '新的世界') return esc(text || '—');

  // Find all section headers with their positions: 【标题】 or **标题** at line start
  var headers = [];
  var re = /(?:^|\n)(?:【([^】]+)】|(?:\*\*|__)([^*_]+)(?:\*\*|__))\s*/gm;
  var match;
  while ((match = re.exec(text)) !== null) {
    var title = (match[1] || match[2] || '').trim();
    if (title && title.length > 1 && title.length < 30) {
      headers.push({ title: title, start: match.index + match[0].length });
    }
  }

  if (headers.length <= 1) {
    return '<div class="scene-accordion"><div class="scene-section no-sections">'
      + '<div class="scene-section-body">' + esc(text.replace(/\n/g, ' ')) + '</div></div></div>';
  }

  // Build sections with correct content boundaries
  var sections = [];
  for (var i = 0; i < headers.length; i++) {
    var contentStart = headers[i].start;
    var contentEnd = (i + 1 < headers.length) ? headers[i + 1].start - 1 : text.length;
    // Walk contentEnd back to the beginning of the next header
    if (i + 1 < headers.length) {
      var probe = text.lastIndexOf('\n', headers[i + 1].start - 2);
      if (probe > contentStart) contentEnd = probe;
    }
    var content = text.substring(contentStart, contentEnd).trim();
    if (content || headers[i].title) {
      sections.push({ title: headers[i].title, content: content });
    }
  }

  var html = '<div class="scene-accordion">';
  sections.forEach(function(s, i) {
    html += '<div class="scene-section' + (i === 0 ? ' open' : '') + '">'
      + '<div class="scene-section-header" onclick="toggleSceneSection(this)">'
      + '<span class="arrow">▸</span><span>' + esc(s.title) + '</span>'
      + '</div>'
      + '<div class="scene-section-body">' + esc(s.content) + '</div>'
      + '</div>';
  });
  html += '</div>';
  return html;
}

function toggleSceneSection(header) {
  var section = header.parentElement;
  section.classList.toggle('open');
}

    var sceneText = dynamicScene || bgScene || '新的世界';

    html += '<div class="protag-status-bar">';

// ===== EXPORT / IMPORT =====
function exportAll() {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'tavern_worlds_backup_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('导出成功', 'success');
}

function importAll(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.worlds || !Array.isArray(data.worlds)) throw new Error('格式无效');
      state = { ...state, ...data };
      if (!state.chatHistory) state.chatHistory = {};
      state.worlds.forEach(function (w) {
        if (!state.chatHistory[w.id]) state.chatHistory[w.id] = [];
      });
      saveState();
      renderAll();
      updateSpeakerTag();
      toast('导入成功：' + state.worlds.length + ' 个世界', 'success');
    } catch (ex) {
      toast('文件格式错误：' + ex.message, 'error');
    }
  };
  reader.readAsText(file);
  // Reset file input so the same file can be re-imported
  event.target.value = '';
}

function wizDrawSkill() {
  var w = getActiveWorld(); if (!w) return;
  if (w.protagonist.skillDrawn) { toast('一技之长已经抽取过了', 'error'); return; }
  // Filter locked skills
  var totalClears = state.totalClears || 0;
  var available = skillPoolDefs.filter(function(s){
    if (!s.unlock) return true;
    return (state.unlockedSkills||[]).indexOf(s.name) >= 0;
  });
  if (available.length === 0) { toast('没有可抽取的技能了', 'error'); return; }
  // Weighted random
  var weighted = [];
  available.forEach(function(s){for(var i=0;i<Math.ceil(({ '白':10, '绿':5, '蓝':2, '紫':0.5, '金':0.2 }[s.rarity]||3)*10);i++) weighted.push(s);});
  var picks = [];
  var used = {};
  for (var i=0; i<3 && weighted.length>0; i++) {
    var idx = Math.floor(Math.random()*weighted.length);
    var s = weighted[idx];
    if (used[s.name]) continue;
    used[s.name] = true;
    picks.push(s);
    weighted = weighted.filter(function(x){return x.name!==s.name;});
  }
  showSkillPicker(w, picks);
}

function showSkillPicker(w, picks) {
  var rarityColors = {'白':'#aaa','绿':'#4a8','蓝':'#48a','紫':'#a4a','金':'#da4'};

  html += '<div style="text-align:center;margin-bottom:16px;font-size:18px;font-weight:700">◎ 三选一：主角的一技之长</div>';
  html += '<div style="text-align:center;margin-bottom:8px;font-size:11px;color:var(--red)">‡ 仅此一次，不可重来</div>';
  html += '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">';
  picks.forEach(function(s,i){
    var rc = rarityColors[s.rarity]||'#aaa';
    html += '<div class="talent-card" style="border-color:'+rc+'" onclick="pickSkill(\''+s.name+'\')">'
      + '<div class="talent-card-rarity" style="background:'+rc+'">'+s.rarity+'</div>'
      + '<div class="talent-card-name" style="font-size:18px">'+s.name+'</div>'

  });

}

function closeSkillPicker() {
  var el = document.getElementById('skillPickerOverlay');
  if (el) el.remove();
  var data = window._skillPickData;
  if (data) {
    // User closed without picking — assign random
    var w = state.worlds.find(function(w){return w.id===data.worldId;});
    if (w && !w.protagonist.skillDrawn) {
      var skill = data.picks[Math.floor(Math.random()*data.picks.length)].name;
      w.protagonist.skill = skill;
      w.protagonist.skillDrawn = true;
      if (state.seenSkills === undefined) state.seenSkills = [];
      if (state.seenSkills.indexOf(skill) < 0) state.seenSkills.push(skill);
      saveState(); renderWizard(w);
      toast('◎ 随机分配一技之长：' + skill, 'info');
    }
  }
  window._skillPickData = null;
}

function pickSkill(skill) {
  var el = document.getElementById('skillPickerOverlay');
  if (el) el.remove();
  var data = window._skillPickData;
  if (!data) return;
  var w = state.worlds.find(function(w){return w.id===data.worldId;});
  if (!w) return;
  w.protagonist.skill = skill;
  w.protagonist.skillDrawn = true;
  // Track seen skill globally
  if (state.seenSkills === undefined) state.seenSkills = [];
  if (state.seenSkills.indexOf(skill) < 0) state.seenSkills.push(skill);
  saveState(); renderWizard(w);
  toast('◎ 一技之长：' + skill, 'success');
  window._skillPickData = null;
}

function effectiveTalents(prot) {
  return (prot.talents||[]).filter(function(t){ return t.id !== 'n8'; }).length;
}

function wizDrawTalents() {
  var w = getActiveWorld(); if (!w) return;
  if (w.protagonist.drawCount < 1) { toast('没有抽取次数了', 'error'); return; }
  if (effectiveTalents(w.protagonist) >= w.protagonist.maxSlots) { toast('天赋槽位已满', 'error'); return; }
  // Note: drawCount is consumed in pickTalentCard/confirmReplace, not here.
  // The "再抽一次" uses _rerolls (from Fate Book), not drawCount.
  var available = talentPool.filter(function(t){
    if (t.unlock && state.unlockedTalents.indexOf(t.id) < 0) return false;
    if (t.nsfw && !w.allowNSFW) return false;
    if (w.protagonist.talents.some(function(st){return st.id===t.id;})) return false;
    if (w.mode === 'dice' && t.noDice) return false; // incompatible with dice
    if (w.mode !== 'dice' && t.diceOnly) return false; // dice-only talent
    return true;
  });
  if (available.length === 0) { toast('没有可选天赋了', 'info'); return; }
  // Weight by rarity (apply rarity boost from Fate Tree)
  var weights = { '白':10, '绿':5, '蓝':3, '紫':1.5, '金':0.5, '红':0.2 };
  var boost = w._rarityBoost || 0;
  if (boost > 0) {
    weights['紫'] += boost * 2;
    weights['金'] += boost * 1.5;
    weights['红'] += boost * 1;
  }
  var weighted = [];
  available.forEach(function(t){
    var wgt = weights[t.rarity] || 3;
    for (var i=0; i<Math.ceil(wgt*10); i++) weighted.push(t);
  });
  var picks = [];
  var pool = weighted.slice();
  var pickCount = (w.protagonist._doublePick) ? 6 : 3;
  for (var i=0; i<pickCount && pool.length>0; i++) {
    var idx = Math.floor(Math.random()*pool.length);
    picks.push(pool[idx]);
    pool = pool.filter(function(t){return t.id!==picks[picks.length-1].id;});
  }
  showCardPicker(w, picks);
}

function showCardPicker(w, picks) {
